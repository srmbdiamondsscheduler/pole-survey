<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10202e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Pole Survey</title>
<style>
:root{--bg:#10202e;--card:#1a3045;--ink:#eef3f7;--mut:#8fa6b8;--acc:#d9a441;--ok:#4cc38a;--bad:#e5645a;--line:#2b4660}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
header h1{font-size:18px;margin:0;flex:1}
button,.btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:46px}
button.pri,.btn.pri{background:var(--acc);color:#1b1405;border-color:var(--acc)}
button.dng{color:var(--bad)}
button.sm{padding:6px 10px;min-height:34px;font-size:14px}
main{padding:14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input,select,textarea{width:100%;background:#0f1d2a;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;min-height:46px}
.row{display:flex;gap:10px}.row>*{flex:1}
.pole-item{display:flex;align-items:center;gap:12px;cursor:pointer}
.grip{font-size:24px;line-height:1;color:var(--mut);padding:8px 6px;margin:-8px -2px -8px -8px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}.pole-item.drag{outline:2px solid var(--acc);background:var(--card2,#1b2a37)}body.viewer .grip{display:none}
.pole-item .t{flex:1}.pole-item small{color:var(--mut)}
.badge{font-size:12px;background:#0f1d2a;border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--mut)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .n{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.65);border-radius:8px;padding:0 7px;font-size:12px}
.att{display:grid;grid-template-columns:30px 1fr 120px 36px;gap:8px;align-items:center;margin-bottom:8px}
.att .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#10202e}
.att .nm{font-weight:600;min-width:0}.att .nm small{display:block;color:var(--mut);font-weight:400}
.att input{text-align:right;font-weight:700;font-size:17px}
.att input.bad{border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:20px;padding:8px 12px;min-height:38px;font-size:14px}
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px max(10px,env(safe-area-inset-bottom));display:flex;gap:10px;z-index:6}
.sticky>*{flex:1}
#diagram svg{width:100%;height:auto;background:#0b1620;border-radius:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:none;flex-direction:column}
.modal.on{display:flex}
.modal .bar{display:flex;gap:10px;padding:10px 14px;align-items:center}
.modal .bar span{flex:1;color:var(--mut);font-size:14px}
.empty{color:var(--mut);text-align:center;padding:30px 10px}

.attbox{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.attbox:last-child{border-bottom:0;margin-bottom:0}
.dirs{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:2px}
.dl{font-size:12px;color:var(--mut);margin:2px 0 4px}
.dbtn{padding:0;min-height:38px;font-size:13px;border-radius:8px}
.dbtn.on{background:var(--acc);color:#1b1405;border-color:var(--acc)}
.dlg{margin:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(92vw,430px)}
.dlg h3{margin:0 0 12px}.dlg button{width:100%;margin-top:10px}
.dlg small{color:var(--mut);display:block;margin-top:4px}

.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;background:transparent}.tab.on{background:var(--acc);color:#1b1405;border-color:var(--acc)}
.chk{width:26px;height:26px;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;font-weight:800;color:#1b1405;flex:none}
.pole-item.sel{border-color:var(--acc)}.pole-item.sel .chk{background:var(--acc);border-color:var(--acc)}
.bar3{display:flex;gap:10px}

.stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#000;-webkit-user-select:none;user-select:none}
#vwrap{position:absolute;left:0;top:0;transform-origin:0 0}
#vimg{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.mk{position:absolute;width:0;height:0}
.mki{position:absolute;left:0;top:0;transform:scale(var(--inv,1));transform-origin:0 0}
.sheetpick{position:absolute;left:0;right:0;bottom:0;max-height:50vh;overflow:auto;background:rgba(26,48,69,.97);border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom))}
.sheetpick .pt{font-size:13px;color:var(--mut);margin-bottom:8px}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchips .chip{padding:4px 9px;min-height:34px;font-size:13px}
.vchips .chip.cur{background:currentColor}.vchips .chip.cur span{color:#10202e}
.prow{display:flex;gap:8px;margin-top:10px;align-items:center}.prow>*{flex:1}.prow input{min-height:42px;padding:8px 10px;font-weight:700;text-align:right}
.pcard{display:flex;align-items:center;gap:12px;cursor:pointer}
.modal#viewer{background:#000}
.tysel{min-height:36px;padding:2px 6px;font-weight:700;font-size:15px;background:transparent;border:1px solid var(--line);width:100%}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;max-width:90vw;background:rgba(0,0,0,.88);color:#fff;border:1px solid var(--acc);padding:10px 16px;border-radius:22px;z-index:40;display:none;font-weight:600;text-align:center}
.ht:focus{outline:3px solid var(--acc)}
body.viewer #vbadge{display:block}#vbadge{display:none;background:#1d4d6b;color:#fff;text-align:center;font-size:13px;padding:5px 10px}
body.viewer #newp,body.viewer #new,body.viewer #impb,body.viewer #xfer,body.viewer #selb,body.viewer #ren,body.viewer #arcp,body.viewer #delp,body.viewer #gps,body.viewer #gpsm,body.viewer #dm,body.viewer #quick,body.viewer .del,body.viewer #vdel,body.viewer #cam,body.viewer #gal,body.viewer label.btn,body.viewer #vpick,body.viewer #bar .pri#new{display:none!important}
body.viewer #main input,body.viewer #main select,body.viewer #main textarea,body.viewer .dbtn,body.viewer .dot,body.viewer .nb,body.viewer .tysel{pointer-events:none}
</style></head>
<body>
<header><button id="back" class="sm" style="display:none">‹ Back</button><h1 id="title">Pole Survey</h1><button id="cloud" class="sm" title="Live sync">☁</button><button id="unit" class="sm">ft</button></header>
<div id="vbadge">👁 View only — you can look at everything but not change it</div>
<main id="main"></main>
<div id="bar" class="sticky" style="display:none"></div>

<div class="modal" id="viewer">
 <div class="bar"><button id="vclose">Done</button><span style="flex:1"></span><button class="sm" id="vzo">−</button><button class="sm" id="vzi">+</button><button class="sm" id="vfit">Fit</button><button class="dng sm" id="vdel">🗑</button></div>
 <div class="stage" id="vstage"><div id="vwrap"><img id="vimg" alt=""></div></div>
 <div class="sheetpick" id="vpick"></div>
</div>
<div id="toast"></div>
<div class="modal" id="exp"><div class="dlg"><h3 id="exph"></h3><div id="expb"></div></div></div>

<script>
'use strict';
// ---------- constants ----------
const TYPES=[
 {k:'Primary',s:'Primary',c:'#e5645a'},{k:'Crossarm',s:'Crossarm',c:'#d4a373'},{k:'Neutral',s:'Neutral',c:'#9aa7b3'},{k:'Secondary',s:'Secondary',c:'#e8a04a'},
 {k:'Transformer',s:'Xfmr',c:'#c77dff'},{k:'Street light',s:'Street light',c:'#f2e06b'},
 {k:'Power supply',s:'Pwr supply',c:'#ff7eb6'},{k:'Fuse',s:'Fuse',c:'#d6ff6b'},{k:'Bracket',s:'Bracket',c:'#b5a7ff'},
 {k:'Telecom - existing',s:'Telecom',c:'#6fb3d9'},{k:'Fibre - existing',s:'Fibre',c:'#4cc38a'},
 {k:'Strand - existing',s:'Strand',c:'#5b9ec9'},{k:'Strand - proposed',s:'Strand NEW',c:'#d9a441'},
 {k:'Guy / anchor',s:'Anchor',c:'#a0856c'},{k:'Riser',s:'Riser',c:'#7bd0c1'},{k:'Other',s:'Other',c:'#cfcfcf'}];
const DIRS=['N','NE','E','SE','S','SW','W','NW'];
const UTILS=['Manitoba Hydro','Synergy North','Hydro One','Bell','Other'];
const tinfo=k=>TYPES.find(t=>t.k===k)||TYPES[TYPES.length-1];
const tcolor=k=>tinfo(k).c;
const shade=(hex,f)=>'#'+[1,3,5].map(i=>Math.round(parseInt(hex.substr(i,2),16)*f).toString(16).padStart(2,'0')).join('');
const PAL=['#ff5c5c','#ff9f1c','#f7e03d','#9be34b','#2fbf71','#22c7b8','#4cc9f0','#5b8cff','#8f7bff','#c77dff','#ff6ec7','#d4a373']; // one colour per attachment
const acol=a=>PAL[(a.ci??0)%PAL.length];
function ensureColors(p){const used=new Set(p.attachments.filter(a=>a.ci!=null).map(a=>a.ci));let ch=false;
 for(const a of p.attachments)if(a.ci==null){let i=0;while(used.has(i)&&i<PAL.length)i++;if(i>=PAL.length)i=p.attachments.indexOf(a)%PAL.length;a.ci=i;used.add(i);ch=true}return ch}
const dname=a=>a.type==='Crossarm'?`Crossarm (${a.n||3} pri)`:a.type;
const CABLE=new Set(['Primary','Neutral','Secondary','Telecom - existing','Fibre - existing','Strand - existing','Strand - proposed','Other']);
const BR={N:0,NE:45,E:90,SE:135,S:180,SW:225,W:270,NW:315};
let VIEWD=20;const projView={}; // sketch viewing angle (degrees), saved per project
const proj=(b,len)=>{const V=VIEWD*Math.PI/180,r=b*Math.PI/180,E=Math.sin(r),N=Math.cos(r);return [1.1*(E*Math.cos(V)-N*Math.sin(V))*len,-0.7*(E*Math.sin(V)+N*Math.cos(V))*len]};
const dirsOnly=a=>(a.dirs||[]).slice().sort((x,y)=>DIRS.indexOf(x)-DIRS.indexOf(y)).join(',');
const dirStr=a=>dirsOnly(a)+(a.type==='Guy / anchor'&&a.dist!=null?(dirsOnly(a)?' · ':'')+fmtH(a.dist):'');
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safe=s=>String(s||'').replace(/[^\w-]+/g,'_').replace(/^_+|_+$/g,'')||'untitled';
const tick=()=>new Promise(r=>setTimeout(r,0));
let unit=localStorage.getItem('unit')||'ft';
const projName={};
let distoMode=localStorage.getItem('disto')==='1'; // laser reading arrives as typed text; auto-advance to the next empty height
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',2600)}
function focusNextEmpty(){const e=[...document.querySelectorAll('#atts .ht')].find(i=>!i.value);if(e){e.focus({preventScroll:true});e.scrollIntoView({block:'center',behavior:'smooth'});return e}return null}

// ---------- storage (IndexedDB) ----------
let db;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('polesurvey',2);
 r.onupgradeneeded=()=>{const d=r.result;['poles','projects'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};
 r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const st=(n,m)=>db.transaction(n,m).objectStore(n);
const getAll=n=>new Promise(r=>{const q=st(n,'readonly').getAll();q.onsuccess=()=>r(q.result)});
const getOne=(n,id)=>new Promise(r=>{const q=st(n,'readonly').get(id);q.onsuccess=()=>r(q.result)});
const stripP=p=>({...p,photos:p.photos.map(ph=>ph.buf?{id:ph.id,buf:ph.buf,type:ph.type||'image/jpeg'}:{...ph})});
const putOne=(n,o,keep)=>new Promise(r=>{if(!SY.applying&&isViewer())return r();if(!keep)o.updated=Date.now();if(n==='poles'&&!SY.applying)stampPole(o);const q=st(n,'readwrite').put(n==='poles'?stripP(o):o);q.onsuccess=()=>{if(!SY.applying)syDirty(n,o.id);r()}});
async function rescueViaCanvas(blob){ // if bytes can't be read but the picture still displays, re-draw it
 const url=URL.createObjectURL(blob);
 try{const img=new Image();img.src=url;await img.decode();const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));if(!b)throw new Error('rescue failed');return new Uint8Array(await b.arrayBuffer())}
 finally{URL.revokeObjectURL(url)}
}
async function hydrate(p){ // rebuild in-memory Blobs; convert old Blob-format photos to the safer ArrayBuffer format
 let dirty=false;
 for(const ph of p.photos){
  if(ph.buf&&!ph.blob){ph.blob=new Blob([ph.buf],{type:ph.type||'image/jpeg'});continue}
  if(ph.blob&&!ph.buf){let bytes;
   try{bytes=await readBytes(ph.blob)}catch(e){try{bytes=await rescueViaCanvas(ph.blob)}catch(e2){ph.bad=true;continue}}
   ph.buf=bytes.buffer;ph.type='image/jpeg';ph.blob=new Blob([ph.buf],{type:'image/jpeg'});dirty=true}
 }
 if(dirty)await putOne('poles',p,true);
 return p;
}
const getPole=async id=>{const p=await getOne('poles',id);return p?hydrate(p):p};
const delOne=(n,id)=>new Promise(r=>{if(!SY.applying&&isViewer())return r();const q=st(n,'readwrite').delete(id);q.onsuccess=()=>{if(!SY.applying)syTomb(n,id);r()}});
async function migrate(){ // poles saved before projects existed go into one project
 const orphans=(await getAll('poles')).filter(p=>!p.projectId);if(!orphans.length)return;
 const pr={id:uid(),name:'Unsorted poles',notes:'',archived:false,created:Date.now(),updated:Date.now()};
 await putOne('projects',pr,true);for(const p of orphans){p.projectId=pr.id;await putOne('poles',p,true)}
}

// ---------- heights ----------
const M_PER_IN=0.0254;
function parseH(s){
 s=String(s).trim().toLowerCase();if(!s)return null;
 if(unit==='m'){const v=parseFloat(s.replace(',','.'));return isNaN(v)?null:v}
 let m=s.match(/^(\d+(?:\.\d+)?)\s*(?:'|ft|-|\s)\s*(\d+(?:\.\d+)?)?\s*(?:"|in)?$/);
 if(m){const ft=parseFloat(m[1]),inch=m[2]?parseFloat(m[2]):0;return (ft*12+inch)*M_PER_IN}
 const v=parseFloat(s);return isNaN(v)?null:v*12*M_PER_IN;
}
function fmtH(m){
 if(m==null||isNaN(m))return '';
 if(unit==='m')return m.toFixed(2)+' m';
 const t=Math.round(m/M_PER_IN);return Math.floor(t/12)+"'-"+(t%12)+'"';
}
const fmtIn=m=>unit==='m'?m.toFixed(2)+' m':(()=>{const t=Math.round(m/M_PER_IN);return t>=12?Math.floor(t/12)+"'-"+(t%12)+'"':t+'"'})();

// ---------- images ----------
const urlCache={};
function purl(ph){return urlCache[ph.id]||(urlCache[ph.id]=URL.createObjectURL(ph.blob))}
async function compress(file){
 const bmp=await createImageBitmap(file);const max=1800;const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
 const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
 c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(r,'image/jpeg',.82));
}

// ---------- diagram (SVG) ----------
function glyph(k,px,pw,y,c,bg,d){
 // fittings point the way you chose (default: toward the left of the sketch). Returns {svg,back}
 let ux=-1,uy=0;if(d){const [vx,vy]=proj(BR[d],1),m=Math.hypot(vx,vy)||1;ux=vx/m;uy=vy/m}
 const xe=px-pw/2,at=l=>[px+ux*l,y+uy*l],f=v=>v.toFixed(1),back=!!d&&uy<-0.05;
 switch(k){
 case 'Street light':{const [ex,ey]=at(40),hy=ey-7;
  return {back,svg:`<polyline points="${px},${f(y)} ${f(px+ux*20)},${f(y+uy*20-5)} ${f(ex)},${f(hy)}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`+
   `<path d="M${f(ex-14)},${f(hy)} Q${f(ex)},${f(hy-16)} ${f(ex+14)},${f(hy)} Z" fill="${c}"/><rect x="${f(ex-13)}" y="${f(hy)}" width="26" height="3" fill="${c}"/>`+
   `<g stroke="${c}" stroke-width="1.5" opacity=".75"><line x1="${f(ex-9)}" y1="${f(hy+6)}" x2="${f(ex-12)}" y2="${f(hy+15)}"/><line x1="${f(ex)}" y1="${f(hy+6)}" x2="${f(ex)}" y2="${f(hy+16)}"/><line x1="${f(ex+9)}" y1="${f(hy+6)}" x2="${f(ex+12)}" y2="${f(hy+15)}"/></g>`}}
 case 'Power supply':{const [ex,ey]=at(26);
  return {back,svg:`<line x1="${px}" y1="${f(y)}" x2="${f(ex)}" y2="${f(ey)}" stroke="${c}" stroke-width="2"/><rect x="${f(ex-13)}" y="${f(ey-9)}" width="26" height="18" rx="2" fill="${bg}" stroke="${c}" stroke-width="2"/><text x="${f(ex)}" y="${f(ey+4)}" font-size="10" font-weight="700" fill="${c}" text-anchor="middle">PS</text>`}}
 case 'Fuse':{const [ex,ey]=at(20);
  return {back,svg:`<line x1="${px}" y1="${f(y)}" x2="${f(ex)}" y2="${f(ey)}" stroke="${c}" stroke-width="3" stroke-linecap="round"/><rect x="${f(ex-4)}" y="${f(ey)}" width="8" height="21" rx="3" fill="${c}" transform="rotate(14 ${f(ex)} ${f(ey)})"/><circle cx="${f(ex)}" cy="${f(ey)}" r="3.2" fill="${bg}" stroke="${c}" stroke-width="1.5"/>`}}
 case 'Bracket':{const [ex,ey]=at(22);
  return {back,svg:`<polyline points="${px},${f(y)} ${f(ex)},${f(ey)} ${f(ex)},${f(ey+14)}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${f(ex)}" cy="${f(ey+17)}" r="3.5" fill="${c}"/>`}}
 case 'Transformer':{const [ex,ey]=at(24);
  return {back,svg:`<line x1="${px}" y1="${f(y)}" x2="${f(ex)}" y2="${f(ey)}" stroke="${c}" stroke-width="3"/><rect x="${f(ex-11)}" y="${f(ey-5)}" width="22" height="30" rx="5" fill="${c}" opacity=".92"/>`}}
 default:
  return {back:false,svg:`<line x1="${xe-14}" y1="${y}" x2="${xe}" y2="${y}" stroke="${c}" stroke-width="4" stroke-linecap="round"${k==='Strand - proposed'?' stroke-dasharray="6 3"':''}/>`};
 }
}
function diagram(p,o={}){
 VIEWD=projView[p.projectId]??20;ensureColors(p);
 const light=!!o.light,w=440,h=580;
 const bg=light?'#ffffff':'#0b1620',ink=light?'#222':'#cfd8df',sub=light?'#444':'#9db3c4',dim=light?'#99a':'#52697c',leadc=light?'#888':'#6d8497';
 const NSc=light?'#2a6fa3':'#6fb3d9',EWc=light?'#b8741a':'#e8a04a';
 const col=a=>light?shade(acol(a),.68):acol(a);
 const atts=p.attachments.filter(a=>a.height!=null).sort((a,b)=>b.height-a.height);
 const ph=p.poleHeight||Math.max(...atts.map(a=>a.height),0)+1;
 let b0=0,top=Math.max(p.poleHeight||0,...atts.map(a=>a.height),3)*1.04;
 const zoomed=!!p.zoom&&atts.length>1;
 if(zoomed){const lo=atts[atts.length-1].height,hi=atts[0].height,pad=Math.max((hi-lo)*0.3,0.6);b0=Math.max(0,lo-pad);top=Math.min(hi+pad,Math.max(ph,hi)+0.3);if(top-b0<1)top=b0+1}
 const maxD=Math.max(0,...atts.filter(a=>a.type==='Guy / anchor'&&a.dist!=null&&(a.dirs||[]).length).map(a=>a.dist));
 const padT=30,padB=62,gy=h-padB,sc=(gy-padT)/(top-b0),px=170,pw0=16,pw1=9,G=46;
 const y=m=>gy-(m-b0)*sc;
 const hs=maxD>0?Math.min(sc,88/maxD):sc,notScale=maxD>0&&hs<sc-1e-6&&b0===0;
 const cxC=b0>0?84:px,cyC=b0>0?gy+4:gy; // compass sits under the pole, or in the corner when zoomed in
 const pwAt=m=>pw0-(pw0-pw1)*Math.min(1,m/ph);

   `<text x="${(x1+ca*9).toFixed(1)}" y="${(y1+sa*9+3.5).toFixed(1)}" font-size="10" font-weight="700" fill="${c}" stroke="${bg}" stroke-width="2.6" paint-order="stroke" text-anchor="middle">${d}</text>`}};
 let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">`;
 s+=`<defs><linearGradient id="pg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#b79563"/><stop offset=".45" stop-color="#8a6a43"/><stop offset="1" stop-color="#553f26"/></linearGradient></defs>`;
 s+=`<rect width="${w}" height="${h}" fill="${bg}"/>`;
 // ground plane with compass: N-S axis and E-W axis in different colours
 s+=`<ellipse cx="${cxC}" cy="${cyC}" rx="${(1.1*G).toFixed(1)}" ry="${(0.7*G).toFixed(1)}" fill="${light?'#f3efe6':'#14222f'}" stroke="${dim}" stroke-width="1.2"/>`;
 const axis=(b1,b2,c)=>{const [x1,y1]=proj(b1,G),[x2,y2]=proj(b2,G);return `<line x1="${cxC+x1}" y1="${cyC+y1}" x2="${cxC+x2}" y2="${cyC+y2}" stroke="${c}" stroke-width="1.4" opacity=".85"/>`};
 s+=axis(0,180,NSc)+axis(90,270,EWc);
 [[0,'N',NSc],[90,'E',EWc],[180,'S',NSc],[270,'W',EWc]].forEach(([b,l,c])=>{const [x,yy]=proj(b,G*1.34);s+=`<text x="${(cxC+x).toFixed(1)}" y="${(cyC+yy+4).toFixed(1)}" font-size="${l==='N'?15:12}" font-weight="700" fill="${c}" text-anchor="middle">${l}</text>`});
 // attachments -> back (behind pole) and front pieces
 let back='',front='';
 for(const a of atts){const c=col(a),yy=y(a.height),pw=pwAt(a.height),xe=px-pw/2,dirs=a.dirs||[],dash=a.type==='Strand - proposed';
  if(a.type==='Crossarm'){
   const n=a.n||3,th=dirs.length?BR[dirs[0]]:0,armB=(th+90)%180,[ax,ay]=proj(armB,40),tpos=n===1?[0]:n===2?[-.75,.75]:[-.85,0,.85],armc=c,pc=c;
   [1,-1].forEach(sg=>{const seg=`<line x1="${px}" y1="${yy.toFixed(1)}" x2="${(px+sg*ax).toFixed(1)}" y2="${(yy+sg*ay).toFixed(1)}" stroke="#000" stroke-opacity=".55" stroke-width="8" stroke-linecap="round"/><line x1="${px}" y1="${yy.toFixed(1)}" x2="${(px+sg*ax).toFixed(1)}" y2="${(yy+sg*ay).toFixed(1)}" stroke="${armc}" stroke-width="5.5" stroke-linecap="round"/>`;if(sg*ay<0)back+=seg;else front+=seg});
   for(const t of tpos){const Px=px+t*ax,Py=yy+t*ay,isBack=t*ay<0;
    let pin=`<line x1="${Px.toFixed(1)}" y1="${Py.toFixed(1)}" x2="${Px.toFixed(1)}" y2="${(Py-7).toFixed(1)}" stroke="${light?'#666':'#ccc'}" stroke-width="2.6"/><circle cx="${Px.toFixed(1)}" cy="${(Py-8).toFixed(1)}" r="3.4" fill="${pc}" stroke="#000" stroke-width=".7"/>`;
    dirs.forEach(d=>{const st=stub(Px,Py-8,d,40,pc,false);(st.back?back:front);if(st.back)back+=st.svg;else front+=st.svg});
    if(isBack)back+=pin;else front+=pin}
  }else if(a.type==='Guy / anchor'){
   front+=`<circle cx="${px}" cy="${yy.toFixed(1)}" r="3.4" fill="${c}" stroke="#000" stroke-width=".7"/>`;
   const d0=dirs[0];
   if(d0&&b0===0){
    const dl=a.dist!=null?a.dist:maxD||1,[ox,oy]=proj(BR[d0],dl*hs),gx=px+ox,gz=gy+oy;
    let g=`<line x1="${px}" y1="${yy.toFixed(1)}" x2="${gx.toFixed(1)}" y2="${gz.toFixed(1)}" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/>`;
    g+=`<line x1="${px}" y1="${gy}" x2="${gx.toFixed(1)}" y2="${gz.toFixed(1)}" stroke="${dim}" stroke-width="1.1" stroke-dasharray="4 3"/>`;
    if(a.dist!=null)g+=`<text x="${((px+gx)/2).toFixed(1)}" y="${((gy+gz)/2+(oy>=0?13:-6)).toFixed(1)}" font-size="11" font-weight="700" fill="${c}" stroke="${bg}" stroke-width="2.6" paint-order="stroke" text-anchor="middle">${esc(fmtH(a.dist))}</text>`;
    const ax=gx+(ox>=0?13:-13),ay=gz+15; // arrow pointing at the spot where the anchor enters the ground
    const an=Math.atan2(gz-ay,gx-ax),ca=Math.cos(an),sa=Math.sin(an);
    g+=`<line x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${(gx-ca*6).toFixed(1)}" y2="${(gz-sa*6).toFixed(1)}" stroke="${ink}" stroke-width="2" stroke-linecap="round"/><polygon points="${gx.toFixed(1)},${gz.toFixed(1)} ${(gx-ca*8+sa*4).toFixed(1)},${(gz-sa*8-ca*4).toFixed(1)} ${(gx-ca*8-sa*4).toFixed(1)},${(gz-sa*8+ca*4).toFixed(1)}" fill="${ink}"/>`;
    g+=`<circle cx="${gx.toFixed(1)}" cy="${gz.toFixed(1)}" r="3.4" fill="${c}" stroke="#000" stroke-width=".8"/><text x="${(ax+(ox>=0?4:-4)).toFixed(1)}" y="${(ay+11).toFixed(1)}" font-size="10" font-weight="700" fill="${c}" stroke="${bg}" stroke-width="2.6" paint-order="stroke" text-anchor="${ox>=0?'start':'end'}">${d0} anchor</text>`;
    if(oy<0)back+=g;else front+=g;
   }else if(d0){const st=stub(px,yy,d0,46,c,false);if(st.back)back+=st.svg;else front+=st.svg}
  }else if(CABLE.has(a.type)&&dirs.length){
   front+=`<circle cx="${px}" cy="${yy.toFixed(1)}" r="3.2" fill="${c}" stroke="#000" stroke-width=".7"/>`;
   dirs.forEach(d=>{const st=stub(px,yy,d,46,c,dash);if(st.back)back+=st.svg;else front+=st.svg});
  }else{const gl=glyph(a.type,px,pw,yy,c,bg,dirs[0]);if(gl.back)back+=gl.svg;else front+=gl.svg}
 }
 s+=back;
 const tp=Math.min(ph,top),wb=pwAt(b0),wt=pwAt(tp);
 s+=`<polygon points="${px-wb/2},${gy} ${px+wb/2},${gy} ${px+wt/2},${y(tp)} ${px-wt/2},${y(tp)}" fill="url(#pg)" stroke="${light?'#6b5232':'#c9a46e'}" stroke-width=".8"/>`;
 if(tp===ph){s+=`<ellipse cx="${px}" cy="${y(ph)}" rx="${pw1/2}" ry="2.2" fill="#c9a46e" stroke="#6b5232" stroke-width=".6"/>`;
  if(p.poleHeight)s+=`<text x="${px}" y="${y(ph)-8}" font-size="11" fill="${light?'#7a5a2a':'#c9a46e'}" text-anchor="middle">${esc(fmtH(p.poleHeight))}</text>`}
 const brk=yy=>`<path d="M${px-14},${yy} l7,-5 l7,5 l7,-5 l7,5" fill="none" stroke="${ink}" stroke-width="1.6" stroke-linejoin="round"/>`;

 s+=front;
 // labels on the right, with faint leader lines
 const L=atts.map(a=>({a,y:y(a.height),ly:y(a.height)}));
 for(let i=1;i<L.length;i++)if(L[i].ly-L[i-1].ly<15)L[i].ly=L[i-1].ly+15;
 L.forEach(o=>{const a=o.a,c=col(a),pw=pwAt(a.height),xr=px+pw/2;
  s+=`<polyline points="${xr+2},${o.y.toFixed(1)} ${px+72},${o.y.toFixed(1)} ${px+80},${o.ly.toFixed(1)}" fill="none" stroke="${leadc}" stroke-width=".9" stroke-dasharray="2 3"/>`;
  const nm=tinfo(a.type).s+(a.type==='Crossarm'?' ×'+(a.n||3):''),own=a.owner?' ('+esc(a.owner.slice(0,10))+')':'',d=dirStr(a);
  s+=`<text x="${px+84}" y="${(o.ly+4).toFixed(1)}" font-size="12" fill="${c}" font-weight="700">${esc(fmtH(a.height))} <tspan fill="${ink}" font-weight="400">${esc(nm)}${own}</tspan>${d?` <tspan fill="${c}" font-weight="700">${d}</tspan>`:''}</text>`;
 });
 for(let i=1;i<atts.length;i++){const y1=y(atts[i-1].height),y2=y(atts[i].height),g=atts[i-1].height-atts[i].height;

  if(notScale)s+=`<text x="8" y="${h-8}" font-size="10" fill="${sub}">Anchor distances shortened — labels show true distance</text>`;
  if(zoomed)s+=`<text x="${w-8}" y="${h-8}" font-size="10" fill="${sub}" text-anchor="end">Zoomed to attachments — not full pole height</text>`;

}

// ---------- navigation ----------
let view='projects',curProj=null,cur=null;
const main=$('#main'),bar=$('#bar');
function setHeader(t,back){$('#title').textContent=t;$('#back').style.display=back?'':'none'}

function askText(title,placeholder,val=''){return new Promise(res=>{

// ---------- screen 1: projects ----------
let pTab='active',pSelMode=false,pSet=new Set();
async function showProjects(){
 view='projects';cur=null;curProj=null;setHeader('Pole Survey',false);
 const [projs,poles]=await Promise.all([getAll('projects'),getAll('poles')]);
 projs.forEach(p=>{projName[p.id]=p.name;projView[p.id]=p.view});
 projs.sort((a,b)=>b.updated-a.updated);
 const act=projs.filter(p=>!p.archived),arc=projs.filter(p=>p.archived),ps=pTab==='active'?act:arc;
 pSet=new Set([...pSet].filter(id=>ps.some(p=>p.id===id)));
 const cnt=p=>{const mine=poles.filter(x=>x.projectId===p.id&&!x.archived);return {n:mine.length,ph:mine.reduce((t,x)=>t+x.photos.length,0)}};
 main.innerHTML=`<div class="tabs"><button class="tab ${pTab==='active'?'on':''}" data-t="active">Projects (${act.length})</button><button class="tab ${pTab==='archived'?'on':''}" data-t="archived">Archived (${arc.length})</button></div>`+
  (ps.length?`<div class="row" style="margin-bottom:12px"><button id="selb" class="sm">${pSelMode?'Cancel':'Select'}</button>${pSelMode?'<button id="alls" class="sm">Select all</button>':''}</div>`:'')+
  (ps.length?ps.map(p=>{const c=cnt(p);return `<div class="card pole-item${pSet.has(p.id)?' sel':''}" data-id="${p.id}">${pSelMode?`<div class="chk">${pSet.has(p.id)?'✓':''}</div>`:''}<div class="t"><b>${esc(p.name)}</b><br><small>${new Date(p.updated).toLocaleDateString()}</small></div><span class="badge">${c.n} poles</span><span class="badge">${c.ph} 📷</span></div>`}).join(''):
   `<div class="empty">${pTab==='active'?'No projects yet.<br>Tap “New project” — a project holds all the poles for one job, and exports as a single PDF + CSV.':'Nothing archived.'}</div>`);
 main.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{pTab=t.dataset.t;pSelMode=false;pSet.clear();showProjects()});
 main.querySelectorAll('.pole-item').forEach(e=>e.onclick=async()=>{if(pSelMode){pSet.has(e.dataset.id)?pSet.delete(e.dataset.id):pSet.add(e.dataset.id);showProjects()}else{curProj=await getOne('projects',e.dataset.id);lTab='active';lSelMode=false;lSet.clear();showProject()}});
 if($('#selb'))$('#selb').onclick=()=>{pSelMode=!pSelMode;pSet.clear();showProjects()};
 if($('#alls'))$('#alls').onclick=()=>{pSet=pSet.size===ps.length?new Set():new Set(ps.map(p=>p.id));showProjects()};
 bar.style.display='flex';
 if(pSelMode){const n=pSet.size,dis=n?'':'disabled',chosen=()=>ps.filter(p=>pSet.has(p.id));
  bar.innerHTML=`<button id="bArc" ${dis}>${pTab==='active'?'Archive':'Restore'} (${n})</button><button id="bCsv" ${dis}>CSV (${n})</button><button class="dng" id="bDel" ${dis}>Delete (${n})</button>`;
  $('#bArc').onclick=async()=>{for(const p of chosen()){p.archived=pTab==='active';await putOne('projects',p)}pSelMode=false;pSet.clear();showProjects()};
  $('#bCsv').onclick=()=>{const ids=new Set(chosen().map(p=>p.id));dl(new File([csv(poles.filter(x=>ids.has(x.projectId)&&!x.archived))],'pole_survey_projects.csv',{type:'text/csv'}))};
  $('#bDel').onclick=async()=>{const c=chosen();const np=poles.filter(x=>c.some(p=>p.id===x.projectId)).length;
   if(!confirm(`Permanently delete ${c.length} project${c.length>1?'s':''}, including ${np} pole${np===1?'':'s'} and all their photos?\n\nThis cannot be undone. Export first if you still need the data.`))return;
   for(const x of poles)if(c.some(p=>p.id===x.projectId))await delOne('poles',x.id);for(const p of c)await delOne('projects',p.id);pSelMode=false;pSet.clear();showProjects()};
 }else{
  bar.innerHTML='<button class="pri" id="newp">+ New project</button><button id="impb">⇩ Open project file</button><input type="file" id="impf" accept=".json,.polesurvey,application/json" style="display:none">';
  $('#impb').onclick=()=>$('#impf').click();$('#impf').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importProject(f)};

   const pr={id:uid(),name,notes:'',archived:false,created:Date.now(),updated:Date.now()};await putOne('projects',pr,true);curProj=pr;pTab='active';lTab='active';lSelMode=false;lSet.clear();showProject()};
 }
}

// ---------- screen 2: one project's poles ----------
let lTab='active',lSelMode=false,lSet=new Set();
const poleOrd=(a,b)=>{const ha=a.order!=null,hb=b.order!=null;if(ha&&hb)return a.order-b.order;if(ha!==hb)return ha?1:-1;return b.updated-a.updated}; // your own order first-class; poles not yet placed show newest-first at the top
async function showProject(){
 view='project';cur=null;setHeader(curProj.name,true);projName[curProj.id]=curProj.name;projView[curProj.id]=curProj.view;
 const all=(await getAll('poles')).filter(p=>p.projectId===curProj.id).sort(poleOrd);
 const act=all.filter(p=>!p.archived),arc=all.filter(p=>p.archived),ps=lTab==='active'?act:arc;
 lSet=new Set([...lSet].filter(id=>ps.some(p=>p.id===id)));
 const emptyMsg=lTab==='active'?'No poles in this project yet.<br>Tap “New pole” to start.':'Nothing archived.<br>Archive finished poles to keep this list short.';
 main.innerHTML=`<div class="tabs"><button class="tab ${lTab==='active'?'on':''}" data-t="active">Poles (${act.length})</button><button class="tab ${lTab==='archived'?'on':''}" data-t="archived">Archived (${arc.length})</button></div>`+
  `<div class="row" style="margin-bottom:12px">${ps.length?`<button id="selb" class="sm">${lSelMode?'Cancel':'Select'}</button>`:''}${lSelMode?'<button id="alls" class="sm">Select all</button>':'<button id="ren" class="sm">✎ Rename project</button>'}</div>`+
  (ps.length?ps.map(p=>`<div class="card pole-item${lSet.has(p.id)?' sel':''}" data-id="${p.id}">${lSelMode?`<div class="chk">${lSet.has(p.id)?'✓':''}</div>`:'<div class="grip" title="Drag to reorder">⠿</div>'}<div class="t"><b>${esc(p.poleId||'(no ID)')}</b><br><small>${esc(p.utility)} · ${new Date(p.updated).toLocaleDateString()}</small></div><span class="badge">${p.photos.length} 📷</span><span class="badge">${p.attachments.length} att</span></div>`).join(''):`<div class="empty">${emptyMsg}</div>`);
 main.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{lTab=t.dataset.t;lSelMode=false;lSet.clear();showProject()});
 main.querySelectorAll('.grip').forEach(g=>{g.onclick=e=>e.stopPropagation();g.onpointerdown=e=>{
  e.preventDefault();e.stopPropagation();const item=g.closest('.pole-item'),items=()=>[...main.querySelectorAll('.pole-item')];
  item.classList.add('drag');try{g.setPointerCapture(e.pointerId)}catch(_){}
  const mv=ev=>{const y=ev.clientY;if(y<90)window.scrollBy(0,-14);else if(y>innerHeight-110)window.scrollBy(0,14);
   const t=items().find(x=>{if(x===item)return false;const r=x.getBoundingClientRect();return y>r.top&&y<r.bottom});
   if(t){const r=t.getBoundingClientRect(),mid=r.top+r.height/2,below=!!(item.compareDocumentPosition(t)&Node.DOCUMENT_POSITION_FOLLOWING);if(below&&y>mid)item.before(t);else if(!below&&y<mid)item.after(t)}}; // the neighbour hops over the item, so the dragged row stays put in the page and keeps hold of your finger
  const up=async()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);item.classList.remove('drag');
   const ids=items().map(x=>x.dataset.id);
   for(let i=0;i<ids.length;i++){const p=await getOne('poles',ids[i]);if(p&&p.order!==i){p.order=i;await putOne('poles',p,true)}}
   toast('Order saved')};
  g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up)}});
 main.querySelectorAll('.pole-item').forEach(e=>e.onclick=async()=>{if(lSelMode){lSet.has(e.dataset.id)?lSet.delete(e.dataset.id):lSet.add(e.dataset.id);showProject()}else openPole(await getPole(e.dataset.id))});
 if($('#selb'))$('#selb').onclick=()=>{lSelMode=!lSelMode;lSet.clear();showProject()};

 if($('#ren'))$('#ren').onclick=async()=>{const n=await askText('Rename project','Project name',curProj.name);if(!n)return;curProj.name=n;await putOne('projects',curProj);showProject()};
 bar.style.display='flex';
 if(lSelMode){const n=lSet.size,dis=n?'':'disabled',chosen=()=>ps.filter(p=>lSet.has(p.id));
  bar.innerHTML=`<button id="bArc" ${dis}>${lTab==='active'?'Archive':'Restore'} (${n})</button><button id="bCsv" ${dis}>CSV (${n})</button><button class="dng" id="bDel" ${dis}>Delete (${n})</button>`;
  $('#bArc').onclick=async()=>{for(const p of chosen()){p.archived=lTab==='active';await putOne('poles',p)}lSelMode=false;lSet.clear();showProject()};
  $('#bCsv').onclick=()=>dl(new File([csv(chosen())],safe(curProj.name)+'_selected.csv',{type:'text/csv'}));
  $('#bDel').onclick=async()=>{const c=chosen();if(!confirm(`Permanently delete ${c.length} pole${c.length>1?'s':''} and all their photos?\n\nThis cannot be undone. Export first if you still need the data.`))return;for(const p of c)await delOne('poles',p.id);lSelMode=false;lSet.clear();showProject()};
 }else{
  bar.innerHTML=`<button class="pri" id="new">+ New pole</button><button id="expj">Export project (${act.length})</button><button id="xfer">⇄ Send to other device</button>`;
  $('#xfer').onclick=()=>sendProject();
  $('#new').onclick=async()=>{const p={id:uid(),projectId:curProj.id,poleId:'',utility:localStorage.getItem('lastUtil')||UTILS[0],lat:null,lng:null,date:new Date().toISOString().slice(0,10),notes:'',poleHeight:null,poleClass:'',photos:[],attachments:[],archived:false,created:Date.now(),updated:Date.now()};await putOne('poles',p);lTab='active';openPole(p)};

// ---------- screen 3: one pole ----------

const save=async()=>{await putOne('poles',cur);if(curProj){curProj.updated=Date.now();await putOne('projects',curProj,true)}};
const markCount=ph=>cur.attachments.filter(a=>a.photoId===ph.id).length;
const fname=()=>safe(cur.poleId||'pole');
function addAtt(k,extra={}){const a={id:uid(),type:k,owner:'',height:null,dirs:[],note:'',...extra};cur.attachments.push(a);ensureColors(cur);save();return a}

function renderPole(){
 ensureColors(cur);
 setHeader(cur.poleId||'New pole',true);
 main.innerHTML=`
 <div class="card"><h2>Pole</h2>
  <div class="row"><div><label>Pole ID</label><input id="f_id" value="${esc(cur.poleId)}" placeholder="e.g. 12345 or tag #"></div>

function parseCoords(t){ // decimal (49.8951, -97.1384), with N/S/E/W letters, or degrees-minutes-seconds. Returns {lat,lng,west} or null
 t=String(t).trim().replace(/[′’‘]/g,"'").replace(/[″”“]/g,'"').replace(/[º˚]/g,'°');let lat,lng,hemiE=false;
 const dms=[...t.matchAll(/(\d+(?:\.\d+)?)\s*°\s*(?:(\d+(?:\.\d+)?)\s*'\s*)?(?:(\d+(?:\.\d+)?)\s*"\s*)?([NSEW])/gi)];
 if(dms.length>=2){for(const m of dms){let v=+m[1]+(+m[2]||0)/60+(+m[3]||0)/3600;const h=m[4].toUpperCase();if(h==='S'||h==='W')v=-v;if(h==='N'||h==='S')lat=v;else{lng=v;if(h==='E')hemiE=true}}}
 else{const m=t.match(/^\s*([NSEW])?\s*(-?\d+(?:\.\d+)?)\s*°?\s*([NSEW])?\s*[,;\s]\s*([NSEW])?\s*(-?\d+(?:\.\d+)?)\s*°?\s*([NSEW])?\s*$/i);if(!m)return null;
  const a={h:(m[1]||m[3]||'').toUpperCase(),v:+m[2]},b={h:(m[4]||m[6]||'').toUpperCase(),v:+m[5]};
  const ap=x=>x.h==='S'||x.h==='W'?-Math.abs(x.v):x.v;
  if(a.h==='E'||a.h==='W'){lng=ap(a);lat=ap(b);hemiE=a.h==='E'}else{lat=ap(a);lng=ap(b);hemiE=b.h==='E'}}
 if(lat==null||lng==null||!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return null;
 let west=false;if(lng>0&&!hemiE&&lat>41&&lat<84&&lng>50&&lng<141){lng=-lng;west=true} // all of Canada is west of Greenwich
 return {lat,lng,west}}

// ---------- photo viewer: pinch-zoom, pan, draggable arrows ----------
const V={vi:-1,s:1,tx:0,ty:0,w0:0,h0:0,SW:0,SH:0,ah:0,ptrs:new Map(),g:null,sel:null,pend:null};
const vstage=$('#vstage'),vwrap=$('#vwrap'),vimg=$('#vimg'),vpick=$('#vpick');
const MAXZ=10;
function arrowHTML(id,x,y,ang,color,num,sel){
 const r=ang*Math.PI/180,L=56,lx=-(L+15)*Math.cos(r),ly=-(L+15)*Math.sin(r);
 return `<div class="mk" data-id="${id}" style="left:${x*100}%;top:${y*100}%"><div class="mki"><svg width="1" height="1" style="overflow:visible;position:absolute;left:0;top:0">`+
  (sel?`<circle r="17" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="5 4"/>`:'')+
  `<g transform="rotate(${ang})"><line x1="${-L}" y1="0" x2="-6" y2="0" stroke="rgba(0,0,0,0.001)" stroke-width="38" stroke-linecap="round" style="pointer-events:stroke"/>`+
  `<line x1="${-L}" y1="0" x2="-14" y2="0" stroke="#fff" stroke-width="9" stroke-linecap="round"/><line x1="${-L}" y1="0" x2="-14" y2="0" stroke="#000" stroke-width="6.5" stroke-linecap="round"/><line x1="${-L}" y1="0" x2="-14" y2="0" stroke="${color}" stroke-width="4" stroke-linecap="round"/>`+
  `<polygon points="0,0 -22,-10 -22,10" fill="${color}" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/></g>`+
  `<circle r="2" fill="#fff" stroke="#000" stroke-width=".8"/>`+
  (num?`<g transform="translate(${lx.toFixed(1)},${ly.toFixed(1)})"><circle r="10" fill="#000" fill-opacity=".75" stroke="${color}" stroke-width="1.5"/><text text-anchor="middle" dy="4" font-size="12" font-weight="700" fill="#fff" font-family="Arial">${num}</text></g>`:'')+
  `</svg></div></div>`;
}
function drawMarks(){
 const ph=cur.photos[V.vi];vwrap.querySelectorAll('.mk').forEach(e=>e.remove());
 let h='';cur.attachments.forEach((a,i)=>{if(a.photoId===ph.id&&V.sel!==a.id)h+=arrowHTML(a.id,a.x,a.y,a.ang??45,acol(a),i+1,false)});
 const sa=V.sel&&V.sel!=='new'&&cur.attachments.find(a=>a.id===V.sel);
 if(sa)h+=arrowHTML(sa.id,sa.x,sa.y,sa.ang??45,acol(sa),cur.attachments.indexOf(sa)+1,true);
 if(V.pend)h+=arrowHTML('new',V.pend.x,V.pend.y,V.pend.ang,'#ffffff',null,true);
 vwrap.insertAdjacentHTML('beforeend',h);
}
function layout(keepView){
 V.SW=vstage.clientWidth;V.SH=vstage.clientHeight;
 const nw=vimg.naturalWidth||4,nh=vimg.naturalHeight||3,sc=Math.min(V.SW/nw,V.SH/nh);
 V.w0=nw*sc;V.h0=nh*sc;vwrap.style.width=V.w0+'px';vwrap.style.height=V.h0+'px';
 if(!keepView){V.s=1;V.tx=0;V.ty=0}applyView();
}
function applyView(){
 const W=V.w0*V.s,H=V.h0*V.s,ah=V.ah||V.SH;
 V.tx=W<=V.SW?(V.SW-W)/2:Math.min(0,Math.max(V.SW-W,V.tx));
 V.ty=H<=ah?(ah-H)/2:Math.min(0,Math.max(ah-H,V.ty));
 vwrap.style.transform=`translate(${V.tx}px,${V.ty}px) scale(${V.s})`;vwrap.style.setProperty('--inv',1/V.s);
}
function zoomAt(f,cx,cy){ // cx,cy in stage coords
 const ns=Math.min(MAXZ,Math.max(1,V.s*f));if(ns===V.s)return;
 const px=(cx-V.tx)/V.s,py=(cy-V.ty)/V.s;V.s=ns;V.tx=cx-px*ns;V.ty=cy-py*ns;applyView();
}
function ensureVisible(u,v){
 const ah=V.ah||V.SH,sx=V.tx+u*V.w0*V.s,sy=V.ty+v*V.h0*V.s;
 if(sy>ah-40)V.ty-=sy-(ah-40);if(sy<95)V.ty+=95-sy;
 if(sx<70)V.tx+=70-sx;if(sx>V.SW-30)V.tx-=sx-(V.SW-30);applyView();
}
function toImg(cx,cy){const r=vstage.getBoundingClientRect();return {u:(cx-r.left-V.tx)/(V.w0*V.s),v:(cy-r.top-V.ty)/(V.h0*V.s)}}
function selAtt(){return V.sel&&V.sel!=='new'?cur.attachments.find(a=>a.id===V.sel):null}

function setPanel(){
 const a=selAtt(),chips=curK=>`<div class="vchips">${TYPES.map(t=>`<button class="chip" data-k="${t.k}" style="border-color:${t.c};${curK===t.k?`background:${t.c};color:#10202e`:`color:${t.c}`}">${t.k}</button>`).join('')}</div>`;
 let h='';
 if(V.sel==='new')h=`<div class="pt"><b>New arrow</b> — drag it so the tip is on the exact spot, then choose what it is:</div>${chips(null)}<div class="prow"><button class="sm" id="vrot">↻ Rotate arrow</button><button class="sm" id="vcancel">Cancel</button></div>`;
 else if(a)h=`<div class="pt"><b>Arrow ${cur.attachments.indexOf(a)+1}</b> — drag to move, tap a type to change it:</div>${chips(a.type)}<div class="prow"><input id="vht" inputmode="text" placeholder="Height ${unit==='ft'?"23'6":'7.15'}" value="${esc(fmtH(a.height))}"><button class="sm" id="vrot">↻ Rotate</button><button class="sm dng" id="vrm">Delete</button><button class="sm pri" id="vdone">Done</button></div>`;
 else h=`<div class="pt" style="margin:0">Tap the photo to drop an arrow. Pinch to zoom, drag to move around. Tap an arrow to edit it.</div>`;
 vpick.innerHTML=h;
 vpick.querySelectorAll('.vchips .chip').forEach(b=>b.onclick=()=>pickType(b.dataset.k));
 if($('#vrot'))$('#vrot').onclick=()=>{if(V.sel==='new')V.pend.ang=(V.pend.ang+45)%360;else{a.ang=((a.ang??45)+45)%360;save()}drawMarks()};

 if($('#vrm'))$('#vrm').onclick=()=>{if((a.height!=null||(a.dirs&&a.dirs.length)||a.owner)&&!confirm('Delete this attachment and its height?'))return;tombA(a.id);cur.attachments=cur.attachments.filter(x=>x!==a);save();V.sel=null;drawMarks();setPanel()};

}
function pickType(k){
 if(V.sel==='new'){const a=addAtt(k,{photoId:cur.photos[V.vi].id,x:V.pend.x,y:V.pend.y,ang:V.pend.ang});V.pend=null;V.sel=a.id}

function selectMarker(id){V.sel=id;if(id!=='new')V.pend=null;drawMarks();setPanel();

function tapAt(cx,cy){
 if(isViewer())return;
 const {u,v}=toImg(cx,cy);if(u<0||u>1||v<0||v>1)return;
 V.pend={x:u,y:v,ang:V.pend?V.pend.ang:45};V.sel='new';drawMarks();setPanel();ensureVisible(u,v);

function openViewer(i){
 V.vi=i;V.sel=null;V.pend=null;V.ptrs.clear();V.g=null;V.ah=0;
 $('#viewer').classList.add('on');
 const go=()=>{layout(false);drawMarks();setPanel()};
 vimg.onload=()=>requestAnimationFrame(go);vimg.src=purl(cur.photos[i]);

vstage.addEventListener('pointerdown',e=>{
 e.preventDefault();try{vstage.setPointerCapture(e.pointerId)}catch(_){}
 V.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(V.ptrs.size===1){
  const mk=e.target.closest&&e.target.closest('.mk');
  if(mk){const id=mk.dataset.id;if(V.sel!==id)selectMarker(id);
   const m=id==='new'?V.pend:selAtt();V.g={t:'marker',id,x0:e.clientX,y0:e.clientY,ax:m.x,ay:m.y,moved:false}}

 const m=$('#exp'),h=$('#exph'),b=$('#expb');m.classList.add('on');h.textContent='PDF size';
 const n=o.poles.reduce((t,p)=>t+p.photos.length,0),last=localStorage.getItem('pdfsz')||'med';
 const est={full:.45,med:.18,small:.08},fmt=v=>{const mb=n*v*1.7;return mb<1?'under 1 MB':'about '+Math.round(mb)+' MB'};
 b.innerHTML=`<div style="color:var(--mut);font-size:13px;margin-bottom:10px">${o.poles.length} pole${o.poles.length===1?'':'s'}, ${n} photo${n===1?'':'s'}. Smaller PDFs are easier to email; the original photos can still be sent separately at full quality.</div>
 <button id="q_small"${last==='small'?' class="pri"':''}>Small — ${fmt(est.small)} (good for email)</button>
 <button id="q_med"${last==='med'?' class="pri"':''}>Medium — ${fmt(est.med)} (readable detail)</button>
 <button id="q_full"${last==='full'?' class="pri"':''}>Full quality — ${fmt(est.full)} (best for design)</button><button id="xc">Cancel</button>`;
 const go=(k,max,q)=>()=>{localStorage.setItem('pdfsz',k);PDFQ.max=max;PDFQ.q=q;exportBuild(o)};
 $('#q_small').onclick=go('small',900,.6);$('#q_med').onclick=go('med',1300,.72);$('#q_full').onclick=go('full',0,.86);
 $('#xc').onclick=()=>m.classList.remove('on');
}
async function exportBuild({base,poles,project}){
 poles=(await Promise.all(poles.map(async p=>(await getPole(p.id))||p)));
 const skipped=[];
 const m=$('#exp'),h=$('#exph'),b=$('#expb');m.classList.add('on');
 h.textContent=project?'Building project PDF…':'Building PDF…';b.innerHTML='<div class="empty" id="prog" style="padding:10px">Starting…</div>';
 await tick();
 let pdf;try{pdf=await makePdf(poles,{project,skipped,onProgress:(k,n,p)=>{const e=$('#prog');if(e)e.textContent=`Pole ${k} of ${n}: ${p.poleId||'(no ID)'}`}})}
 catch(e){h.textContent='Could not build the PDF';b.innerHTML=`<p style="color:var(--mut)">${esc(e.message)}</p><button id="xc">Close</button>`;$('#xc').onclick=()=>m.classList.remove('on');return}
 const files=[new File([pdf],base+'.pdf',{type:'application/pdf'}),new File([csv(poles)],base+'.csv',{type:'text/csv'})];
 const photos=[],seen={};
 poles.forEach(p=>{let nm=safe(p.poleId||'pole');seen[nm]=(seen[nm]||0)+1;if(seen[nm]>1)nm+='_'+seen[nm];p.photos.forEach((ph,i)=>ph.bad||photos.push(new File([ph.blob],`${nm}_photo${i+1}.jpg`,{type:'image/jpeg'})))});
 const kb=f=>f.size>1048576?(f.size/1048576).toFixed(1)+' MB':Math.round(f.size/1024)+' KB';
 const canShare=f=>navigator.canShare&&navigator.canShare({files:f});
 h.textContent='Ready to send';
 b.innerHTML=`<div style="color:var(--mut);font-size:13px;margin-bottom:10px">${poles.length} pole${poles.length===1?'':'s'}, ${photos.length} photo${photos.length===1?'':'s'} — the PDF has the sketches, tagged photos and every photo at full size.</div>
  ${skipped.length?`<div style="color:var(--bad);font-size:13px;margin-bottom:10px">⚠ Left out of the PDF (could not be read):<br>${skipped.map(esc).join('<br>')}<br>Delete and re-add those photos if you need them.</div>`:''}
  <div>📄 ${esc(files[0].name)} <small>${kb(files[0])}</small></div><div style="margin-top:8px">📊 ${esc(files[1].name)} <small>${kb(files[1])}</small></div>
  ${canShare(files)?'<button class="pri" id="xs">Share PDF + CSV</button>':''}
  <button id="xd" ${canShare(files)?'':'class="pri"'}>Download PDF + CSV</button>
  ${photos.length?(canShare(photos)?`<button id="xp">Share ${photos.length} photo${photos.length>1?'s':''} separately</button>`:`<button id="xp">Download ${photos.length} photo${photos.length>1?'s':''} separately</button>`):''}
  <button id="xc">Close</button>`;
 const sh=async f=>{try{await navigator.share({files:f,title:base})}catch(e){}};
 if($('#xs'))$('#xs').onclick=()=>sh(files);
 if($('#xp'))$('#xp').onclick=()=>canShare(photos)?sh(photos):photos.forEach((f,i)=>setTimeout(()=>dl(f),i*500));
 $('#xd').onclick=()=>{files.forEach((f,i)=>setTimeout(()=>dl(f),i*500))};
 $('#xc').onclick=()=>m.classList.remove('on');
}


// ---------- transfer a project between devices (phone <-> laptop) ----------
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const unb64=t=>{const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function sendProject(){
 const m=$('#exp'),h=$('#exph'),b=$('#expb');m.classList.add('on');h.textContent='Packing project…';b.innerHTML='<div class="empty" style="padding:10px">Please wait…</div>';await tick();
 const all=(await getAll('poles')).filter(p=>p.projectId===curProj.id);const parts=[];
 parts.push('{"format":"polesurvey-project","v":1,"project":'+JSON.stringify(curProj)+',"poles":[');
 for(let i=0;i<all.length;i++){const p=await getPole(all[i].id);
  const q={...p,photos:p.photos.filter(x=>x.buf).map(x=>({id:x.id,type:x.type||'image/jpeg',data:b64(new Uint8Array(x.buf))}))};
  delete q.blob;parts.push((i?',':'')+JSON.stringify(q))}
 parts.push(']}');
 const f=new File(parts,safe(curProj.name)+'.polesurvey.json',{type:'application/json'});
 const kb=f.size>1048576?(f.size/1048576).toFixed(1)+' MB':Math.round(f.size/1024)+' KB';
 const can=navigator.canShare&&navigator.canShare({files:[f]});
 h.textContent='Project file ready';
 b.innerHTML=`<div style="color:var(--mut);font-size:13px;margin-bottom:10px">${all.length} pole${all.length===1?'':'s'} with all photos, GPS, attachments and heights. On the other device, tap “Open project file” on the project list. Opening it again later updates the same project — the newer version of each pole wins.</div><div>📦 ${esc(f.name)} <small>${kb}</small></div>
 ${can?'<button class="pri" id="xs">Share (AirDrop, email, Teams, OneDrive…)</button>':''}<button id="xd" ${can?'':'class="pri"'}>Download file</button><button id="xc">Close</button>`;
 if($('#xs'))$('#xs').onclick=async()=>{try{await navigator.share({files:[f],title:curProj.name})}catch(e){}};
 $('#xd').onclick=()=>dl(f);$('#xc').onclick=()=>m.classList.remove('on');
}
async function importProject(file){
 try{
  const d=JSON.parse(await file.text());
  if(d.format!=='polesurvey-project'||!d.project||!Array.isArray(d.poles))throw new Error('This is not a Pole Survey project file.');
  const ex=await getOne('projects',d.project.id);let added=0,upd=0,kept=0;
  if(!ex||(d.project.updated||0)>(ex.updated||0))await putOne('projects',{...ex,...d.project},true);
  for(const q of d.poles){
   const old=await getOne('poles',q.id);
   if(old&&(old.updated||0)>=(q.updated||0)){kept++;continue}
   const p={...q,photos:q.photos.map(x=>({id:x.id,type:x.type,buf:unb64(x.data).buffer}))};
   await putOne('poles',p,true);old?upd++:added++}
  toast(`Imported “${d.project.name}”: ${added} new, ${upd} updated, ${kept} unchanged`);
  curProj=await getOne('projects',d.project.id);showProjects();
 }catch(e){alert('Could not open that file: '+e.message)}
}


// ---------- live sync (Supabase) ----------
const SY={adding:false,applying:false,busy:false,state:'off',msg:''};
const lsj=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const lss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const tombA=id=>{(cur.da=cur.da||{})[id]=Date.now()},tombP=id=>{(cur.dp=cur.dp||{})[id]=Date.now()};
const SKIP=new Set(['photos','attachments','dp','da','id','updated','fu','fh']);
function stampPole(p){const now=Date.now();p.fu=p.fu||{};p.fh=p.fh||{};
 for(const k of Object.keys(p)){if(SKIP.has(k))continue;const h=JSON.stringify(p[k]);if(p.fh[k]!==h){p.fh[k]=h;p.fu[k]=now}}
 for(const a of p.attachments){const {u,h,...rest}=a;const hh=JSON.stringify(rest);if(a.h!==hh){a.h=hh;a.u=now}}}
function syCfg(){return lsj('sy_cfg',null)}
function isViewer(){const c=syCfg();return !!(c&&c.viewer)}
function syDirty(n,id){if(!syCfg())return;const d=lsj('sy_dirty',{});d[id]=n;lss('sy_dirty',d);syKick()}
function syTomb(n,id){if(!syCfg())return;const t=lsj('sy_tomb',{});t[id]=n;lss('sy_tomb',t);const d=lsj('sy_dirty',{});delete d[id];lss('sy_dirty',d);syKick()}
let kickT;function syKick(){if(isViewer())return;clearTimeout(kickT);kickT=setTimeout(syncNow,1500)}
function syStatus(state,msg){SY.state=state;SY.msg=msg||'';document.body.classList.toggle('viewer',isViewer());const b=$('#cloud');if(!b)return;b.textContent=({off:'☁',ok:'☁✓',sync:'☁↻',err:'☁⚠'}[state]||'☁').replace('☁',isViewer()?'👁':'☁')}
async function syToken(){const c=syCfg();if(!c)throw new Error('not set up');
 if(c.token&&c.exp-Date.now()>60000)return c;
 const r=await fetch(c.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:c.refresh})});
 if(!r.ok)throw new Error('sign-in expired — open ☁ and sign in again');
 const j=await r.json();c.token=j.access_token;c.refresh=j.refresh_token;c.exp=Date.now()+j.expires_in*1000;lss('sy_cfg',c);return c}
async function sb(path,o={}){const c=await syToken();const r=await fetch(c.url+path,{...o,headers:{apikey:c.key,Authorization:'Bearer '+c.token,...(o.headers||{})}});
 if(!r.ok){const t=await r.text().catch(()=>'');throw new Error(r.status+' '+t.slice(0,120))}return r}
async function syLogin(url,key,email,pw,viewer){url=url.trim().replace(/\/+$/,'');
 const r=await fetch(url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key.trim(),'Content-Type':'application/json'},body:JSON.stringify({email:email.trim(),password:pw})});
 if(!r.ok)throw new Error('Sign-in failed — check the URL, key, email and password');
 const j=await r.json();lss('sy_cfg',{url,key:key.trim(),email:email.trim(),viewer:!!viewer,token:j.access_token,refresh:j.refresh_token,exp:Date.now()+j.expires_in*1000});
 if(viewer){lss('sy_dirty',{});return}
 // first time on this device: everything local gets pushed once
 const d=lsj('sy_dirty',{});for(const n of ['poles','projects'])for(const x of await getAll(n))d[x.id]=n;lss('sy_dirty',d)}
const docOf=p=>({...p,blob:undefined,photos:p.photos.map(x=>({id:x.id,type:x.type||'image/jpeg'}))});
function mergePole(L,R){
 const base=(L.updated||0)>=(R.updated||0)?L:R;const out={...R,...L};
 const fuL=L.fu||{},fuR=R.fu||{};out.fu={};out.fh={};
 for(const k of new Set([...Object.keys(L),...Object.keys(R)])){if(SKIP.has(k))continue;
  const useL=(fuL[k]||0)>=(fuR[k]||0)&&k in L||!(k in R);const src=useL?L:R;out[k]=src[k];out.fu[k]=Math.max(fuL[k]||0,fuR[k]||0);out.fh[k]=JSON.stringify(src[k])}
 out.dp={...(R.dp||{})};for(const k in (L.dp||{}))out.dp[k]=Math.max(out.dp[k]||0,L.dp[k]);
 out.da={...(R.da||{})};for(const k in (L.da||{}))out.da[k]=Math.max(out.da[k]||0,L.da[k]);
 const ph=new Map();for(const x of R.photos||[])ph.set(x.id,x);for(const x of L.photos||[])if(x.buf||!ph.has(x.id)||!ph.get(x.id).buf)ph.set(x.id,x);
 out.photos=[...ph.values()].filter(x=>!out.dp[x.id]);
 const at=new Map();for(const a of R.attachments||[])at.set(a.id,a);
 for(const a of L.attachments||[]){const o=at.get(a.id);if(!o||(a.u||0)>=(o.u||0))at.set(a.id,a)}
 out.attachments=[...at.values()].filter(a=>!out.da[a.id]);
 out.updated=Math.max(L.updated||0,R.updated||0);
 for(const a of out.attachments){const {u,h,...rest}=a;a.h=JSON.stringify(rest)}
 return out}
function syBusy(){const e=document.activeElement;return SY.adding||(e&&/INPUT|TEXTAREA|SELECT/.test(e.tagName))||document.querySelector('.modal.on')}
async function syPush(){
 if(isViewer())return;
 const dirty=lsj('sy_dirty',{}),up=new Set(lsj('sy_up',[]));
 for(const id of Object.keys(dirty)){const n=dirty[id];
  if(n==='projects'){const pr=await getOne('projects',id);if(pr)await sb('/rest/v1/docs',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{id,kind:'project',data:pr,updated:Date.now(),deleted:false}])});}
  else{const p=await getOne('poles',id);if(p){
    for(const ph of p.photos){if(up.has(ph.id)||!(ph.buf||ph.blob))continue;
     const bytes=ph.buf||await ph.blob.arrayBuffer();
     await sb('/storage/v1/object/photos/'+ph.id,{method:'POST',headers:{'Content-Type':ph.type||'image/jpeg','x-upsert':'true'},body:bytes});up.add(ph.id);lss('sy_up',[...up])}
    const rr=await(await sb('/rest/v1/docs?id=eq.'+id+'&select=data,deleted')).json();
    let out=docOf(p);if(rr[0]&&!rr[0].deleted&&rr[0].data)out=docOf(mergePole(p,rr[0].data));
    await sb('/rest/v1/docs',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{id,kind:'pole',data:out,updated:Date.now(),deleted:false}])})}}
  const d2=lsj('sy_dirty',{});if(d2[id]===n){delete d2[id];lss('sy_dirty',d2)}}
 const tomb=lsj('sy_tomb',{});
 for(const id of Object.keys(tomb)){await sb('/rest/v1/docs',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{id,kind:tomb[id]==='poles'?'pole':'project',data:null,updated:Date.now(),deleted:true}])});const t2=lsj('sy_tomb',{});delete t2[id];lss('sy_tomb',t2)}
}
async function syPull(){
 const metas=await(await sb('/rest/v1/docs?select=id,kind,updated,deleted')).json();
 const rev=lsj('sy_rev',{}),tomb=lsj('sy_tomb',{}),up=new Set(lsj('sy_up',[]));let changed=false,curHit=false;
 const mm0=lsj('sy_miss',{});SY.tries=SY.tries||{};
 for(const m of metas){if(rev[m.id]===m.updated||tomb[m.id])continue;
  if(mm0[m.id]&&Date.now()-(SY.tries[m.id]||0)<60000)continue;SY.tries[m.id]=Date.now();
  const row=(await(await sb('/rest/v1/docs?id=eq.'+m.id+'&select=*')).json())[0];if(!row)continue;
  const store=row.kind==='project'?'projects':'poles';
  if(store==='poles'&&cur&&cur.id===m.id&&syBusy())continue; // never swap data under the user's finger; retried next cycle
  if(row.deleted){SY.applying=true;try{await delOne(store,m.id)}finally{SY.applying=false}
   if(store==='poles'&&cur&&cur.id===m.id){curHit='gone'}rev[m.id]=m.updated;lss('sy_rev',rev);changed=true;continue}
  if(store==='projects'){const L=await getOne('projects',m.id);
   if(!L||(row.data.updated||0)>(L.updated||0)){SY.applying=true;try{await putOne('projects',row.data,true)}finally{SY.applying=false}changed=true;if(curProj&&curProj.id===m.id)Object.assign(curProj,row.data)}
   rev[m.id]=m.updated;lss('sy_rev',rev);continue}
  const R=row.data;
  const miss=[];
  for(const ph of R.photos||[]){ // fetch photos this device doesn't have yet; a photo missing in the cloud never blocks the rest
   const L0=await getOne('poles',m.id);if(L0&&L0.photos.some(x=>x.id===ph.id&&(x.buf||x.blob)))continue;
   try{const r=await sb('/storage/v1/object/authenticated/photos/'+ph.id);ph.buf=await r.arrayBuffer();ph.type=ph.type||'image/jpeg';up.add(ph.id)}catch(e){miss.push(ph.id)}}
  R.photos=(R.photos||[]).filter(x=>!miss.includes(x.id));
  const mm=lsj('sy_miss',{});if(miss.length)mm[m.id]=miss.length;else delete mm[m.id];lss('sy_miss',mm);
  lss('sy_up',[...up]);
  const L=await getOne('poles',m.id);const merged=L?mergePole(L,R):{...R,dp:R.dp||{},da:R.da||{}};
  SY.applying=true;try{await putOne('poles',merged,true)}finally{SY.applying=false}
  if(L&&!miss.length&&JSON.stringify(docOf(merged))!==JSON.stringify(R)){const d=lsj('sy_dirty',{});d[m.id]='poles';lss('sy_dirty',d)}
  if(!miss.length){rev[m.id]=m.updated;lss('sy_rev',rev)}changed=true;if(cur&&cur.id===m.id)curHit=merged}
 if(changed){
  if(curHit==='gone'){toast('This pole was deleted on the other device');showProject()}
  else if(curHit){const sy=window.scrollY;const h=await getPole(cur.id);Object.keys(cur).forEach(k=>delete cur[k]);Object.assign(cur,h);renderPole();window.scrollTo(0,sy)}
  else if(!syBusy()&&!pSelMode&&!lSelMode){const sy=window.scrollY;if(view==='projects')await showProjects();else if(view==='project'){const pr=await getOne('projects',curProj.id);if(pr){curProj=pr;await showProject()}else showProjects()}window.scrollTo(0,sy)}}
}
let syLock=false;
async function syncNow(){if(!syCfg()||syLock)return;if(!navigator.onLine){syStatus('err','offline — will sync when you have signal');return}
 syLock=true;syStatus('sync');
 try{await syPush();await syPull();lss('sy_last',Date.now());syStatus('ok')}
 catch(e){syStatus('err',e.message)}
 finally{syLock=false}}
setInterval(()=>{if(!document.hidden)syncNow()},6000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});window.addEventListener('online',syncNow);
function syncDialog(){const m=$('#exp'),h=$('#exph'),b=$('#expb');m.classList.add('on');const c=syCfg();h.textContent='Live sync';
 if(c){const dn=Object.keys(lsj('sy_dirty',{})).length;
  b.innerHTML=`<div style="font-size:14px">Signed in as <b>${esc(c.email)}</b></div><div style="color:var(--mut);font-size:13px;margin:8px 0">${SY.state==='err'?'⚠ '+esc(SY.msg):SY.state==='sync'?'Syncing…':'✓ Up to date'}${dn?` — ${dn} change${dn>1?'s':''} waiting to upload`:''}<br>Last sync: ${lss&&lsj('sy_last',0)?new Date(lsj('sy_last',0)).toLocaleTimeString():'never'}<br>Changes show up on your other device within a few seconds. Without signal the app keeps working and catches up later.</div>
  ${Object.keys(lsj('sy_miss',{})).length?`<div style="color:var(--bad);font-size:13px;margin-bottom:8px">⚠ ${Object.values(lsj('sy_miss',{})).reduce((a,b)=>a+b,0)} photo(s) are missing in the cloud and could not be copied here. On the phone that took them, tap Repair — it uploads them again.</div>`:''}
  <button class="pri" id="sn">Sync now</button><button id="rp">Repair — upload all photos &amp; poles again</button><button id="so" class="dng">Sign out of sync</button><button id="xc">Close</button>`;
  $('#sn').onclick=async()=>{await syncNow();syncDialog()};
  $('#rp').onclick=async()=>{if(isViewer()){alert('View-only devices cannot upload.');return}localStorage.removeItem('sy_up');localStorage.removeItem('sy_rev');const d=lsj('sy_dirty',{});for(const n of ['poles','projects'])for(const x of await getAll(n))d[x.id]=n;lss('sy_dirty',d);toast('Re-uploading everything…');await syncNow();syncDialog()};
  $('#so').onclick=()=>{if(confirm('Stop syncing on this device? Your data stays here and in the cloud.')){['sy_cfg','sy_dirty','sy_tomb','sy_rev','sy_up'].forEach(k=>localStorage.removeItem(k));document.body.classList.remove('viewer');syStatus('off');m.classList.remove('on')}};
 }else{
  b.innerHTML=`<div style="color:var(--mut);font-size:13px;margin-bottom:8px">Enter the details from your Supabase project (Project Settings → API) and the user you created. Same details on every device.</div>
  <label>Project URL</label><input id="sy_u" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocorrect="off">
  <label>Anon (public) key</label><input id="sy_k" placeholder="eyJ…" autocapitalize="off" autocorrect="off">
  <label>Email</label><input id="sy_e" type="email" autocapitalize="off">
  <label>Password</label><input id="sy_p" type="password">
  <label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="sy_v" style="width:auto"> View only (for the designer — nothing can be changed)</label>
  <div id="sy_m" style="color:var(--bad);font-size:13px"></div>
  <button class="pri" id="sy_go">Sign in &amp; start syncing</button><button id="xc">Close</button>`;
  $('#sy_go').onclick=async()=>{try{$('#sy_m').textContent='';$('#sy_go').disabled=true;await syLogin($('#sy_u').value,$('#sy_k').value,$('#sy_e').value,$('#sy_p').value,$('#sy_v').checked);syStatus('sync');m.classList.remove('on');toast(isViewer()?'Viewing live — read only':'Sync on — uploading…');syncNow()}catch(e){$('#sy_m').textContent=e.message;$('#sy_go').disabled=false}}}
 $('#xc').onclick=()=>m.classList.remove('on')}
$('#cloud').onclick=syncDialog;

$('#unit').onclick=()=>{unit=unit==='ft'?'m':'ft';localStorage.setItem('unit',unit);$('#unit').textContent=unit;view==='pole'?renderPole():view==='project'?showProject():showProjects()};
idb().then(migrate).then(showProjects).then(()=>{syStatus(syCfg()?'sync':'off');syncNow()});
