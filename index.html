<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10202e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Pole Survey</title>
<style>
:root{--bg:#10202e;--card:#1a3045;--ink:#eef3f7;--mut:#8fa6b8;--acc:#d9a441;--ok:#4cc38a;--bad:#e5645a;--line:#2b4660}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
header h1{font-size:18px;margin:0;flex:1}
button,.btn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:46px}
button.pri,.btn.pri{background:var(--acc);color:#1b1405;border-color:var(--acc)}
button.dng{color:var(--bad)}
button.sm{padding:6px 10px;min-height:34px;font-size:14px}
main{padding:14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
input,select,textarea{width:100%;background:#0f1d2a;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;min-height:46px}
.row{display:flex;gap:10px}.row>*{flex:1}
.pole-item{display:flex;align-items:center;gap:12px;cursor:pointer}
.pole-item .t{flex:1}.pole-item small{color:var(--mut)}
.badge{font-size:12px;background:#0f1d2a;border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--mut)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .n{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.65);border-radius:8px;padding:0 7px;font-size:12px}
.att{display:grid;grid-template-columns:30px 1fr 120px 36px;gap:8px;align-items:center;margin-bottom:8px}
.att .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#10202e}
.att .nm{font-weight:600;min-width:0}.att .nm small{display:block;color:var(--mut);font-weight:400}
.att input{text-align:right;font-weight:700;font-size:17px}
.att input.bad{border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:20px;padding:8px 12px;min-height:38px;font-size:14px}
.sticky{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px max(10px,env(safe-area-inset-bottom));display:flex;gap:10px;z-index:6}
.sticky>*{flex:1}
#diagram svg{width:100%;height:auto;background:#0b1620;border-radius:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:none;flex-direction:column}
.modal.on{display:flex}
.modal .bar{display:flex;gap:10px;padding:10px 14px;align-items:center}
.modal .bar span{flex:1;color:var(--mut);font-size:14px}
.empty{color:var(--mut);text-align:center;padding:30px 10px}

.attbox{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.attbox:last-child{border-bottom:0;margin-bottom:0}
.dirs{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:2px}
.dl{font-size:12px;color:var(--mut);margin:2px 0 4px}
.dbtn{padding:0;min-height:38px;font-size:13px;border-radius:8px}
.dbtn.on{background:var(--acc);color:#1b1405;border-color:var(--acc)}
.dlg{margin:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(92vw,430px)}
.dlg h3{margin:0 0 12px}.dlg button{width:100%;margin-top:10px}
.dlg small{color:var(--mut);display:block;margin-top:4px}

.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;background:transparent}.tab.on{background:var(--acc);color:#1b1405;border-color:var(--acc)}
.chk{width:26px;height:26px;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;font-weight:800;color:#1b1405;flex:none}
.pole-item.sel{border-color:var(--acc)}.pole-item.sel .chk{background:var(--acc);border-color:var(--acc)}
.bar3{display:flex;gap:10px}

.stage{flex:1;position:relative;overflow:hidden;touch-action:none;background:#000;-webkit-user-select:none;user-select:none}
#vwrap{position:absolute;left:0;top:0;transform-origin:0 0}
#vimg{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.mk{position:absolute;width:0;height:0}
.mki{position:absolute;left:0;top:0;transform:scale(var(--inv,1));transform-origin:0 0}
.sheetpick{position:absolute;left:0;right:0;bottom:0;max-height:50vh;overflow:auto;background:rgba(26,48,69,.97);border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom))}
.sheetpick .pt{font-size:13px;color:var(--mut);margin-bottom:8px}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchips .chip{padding:4px 9px;min-height:34px;font-size:13px}
.vchips .chip.cur{background:currentColor}.vchips .chip.cur span{color:#10202e}
.prow{display:flex;gap:8px;margin-top:10px;align-items:center}.prow>*{flex:1}.prow input{min-height:42px;padding:8px 10px;font-weight:700;text-align:right}
.pcard{display:flex;align-items:center;gap:12px;cursor:pointer}
.modal#viewer{background:#000}
</style></head>
<body>
<header><button id="back" class="sm" style="display:none">‹ Back</button><h1 id="title">Pole Survey</h1><button id="unit" class="sm">ft</button></header>
<main id="main"></main>
<div id="bar" class="sticky" style="display:none"></div>

<div class="modal" id="viewer">
 <div class="bar"><button id="vclose">Done</button><span style="flex:1"></span><button class="sm" id="vzo">−</button><button class="sm" id="vzi">+</button><button class="sm" id="vfit">Fit</button><button class="dng sm" id="vdel">🗑</button></div>
 <div class="stage" id="vstage"><div id="vwrap"><img id="vimg" alt=""></div></div>
 <div class="sheetpick" id="vpick"></div>
</div>
<div class="modal" id="exp"><div class="dlg"><h3 id="exph"></h3><div id="expb"></div></div></div>

<script>
'use strict';
// ---------- constants ----------
const TYPES=[
 {k:'Primary',s:'Primary',c:'#e5645a'},{k:'Neutral',s:'Neutral',c:'#9aa7b3'},{k:'Secondary',s:'Secondary',c:'#e8a04a'},
 {k:'Transformer',s:'Xfmr',c:'#c77dff'},{k:'Street light',s:'Street light',c:'#f2e06b'},
 {k:'Power supply',s:'Pwr supply',c:'#ff7eb6'},{k:'Fuse',s:'Fuse',c:'#d6ff6b'},{k:'Bracket',s:'Bracket',c:'#b5a7ff'},
 {k:'Telecom - existing',s:'Telecom',c:'#6fb3d9'},{k:'Fibre - existing',s:'Fibre',c:'#4cc38a'},
 {k:'Strand - existing',s:'Strand',c:'#5b9ec9'},{k:'Strand - proposed',s:'Strand NEW',c:'#d9a441'},
 {k:'Guy / anchor',s:'Guy',c:'#a0856c'},{k:'Riser',s:'Riser',c:'#7bd0c1'},{k:'Other',s:'Other',c:'#cfcfcf'}];
const DIRS=['N','NE','E','SE','S','SW','W','NW'];
const UTILS=['Manitoba Hydro','Synergy North','Hydro One','Bell','Other'];
const tinfo=k=>TYPES.find(t=>t.k===k)||TYPES[TYPES.length-1];
const tcolor=k=>tinfo(k).c;
const shade=(hex,f)=>'#'+[1,3,5].map(i=>Math.round(parseInt(hex.substr(i,2),16)*f).toString(16).padStart(2,'0')).join('');
const dirStr=a=>(a.dirs||[]).slice().sort((x,y)=>DIRS.indexOf(x)-DIRS.indexOf(y)).join(',');
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safe=s=>String(s||'').replace(/[^\w-]+/g,'_').replace(/^_+|_+$/g,'')||'untitled';
const tick=()=>new Promise(r=>setTimeout(r,0));
let unit=localStorage.getItem('unit')||'ft';
const projName={};

// ---------- storage (IndexedDB) ----------
let db;
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('polesurvey',2);
 r.onupgradeneeded=()=>{const d=r.result;['poles','projects'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};
 r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const st=(n,m)=>db.transaction(n,m).objectStore(n);
const getAll=n=>new Promise(r=>{const q=st(n,'readonly').getAll();q.onsuccess=()=>r(q.result)});
const getOne=(n,id)=>new Promise(r=>{const q=st(n,'readonly').get(id);q.onsuccess=()=>r(q.result)});
const putOne=(n,o,keep)=>new Promise(r=>{if(!keep)o.updated=Date.now();const q=st(n,'readwrite').put(o);q.onsuccess=()=>r()});
const delOne=(n,id)=>new Promise(r=>{const q=st(n,'readwrite').delete(id);q.onsuccess=()=>r()});
async function migrate(){ // poles saved before projects existed go into one project
 const orphans=(await getAll('poles')).filter(p=>!p.projectId);if(!orphans.length)return;
 const pr={id:uid(),name:'Unsorted poles',notes:'',archived:false,created:Date.now(),updated:Date.now()};
 await putOne('projects',pr,true);for(const p of orphans){p.projectId=pr.id;await putOne('poles',p,true)}
}

// ---------- heights ----------
const M_PER_IN=0.0254;
function parseH(s){
 s=String(s).trim().toLowerCase();if(!s)return null;
 if(unit==='m'){const v=parseFloat(s.replace(',','.'));return isNaN(v)?null:v}
 let m=s.match(/^(\d+(?:\.\d+)?)\s*(?:'|ft|-|\s)\s*(\d+(?:\.\d+)?)?\s*(?:"|in)?$/);
 if(m){const ft=parseFloat(m[1]),inch=m[2]?parseFloat(m[2]):0;return (ft*12+inch)*M_PER_IN}
 const v=parseFloat(s);return isNaN(v)?null:v*12*M_PER_IN;
}
function fmtH(m){
 if(m==null||isNaN(m))return '';
 if(unit==='m')return m.toFixed(2)+' m';
 const t=Math.round(m/M_PER_IN);return Math.floor(t/12)+"'-"+(t%12)+'"';
}
const fmtIn=m=>unit==='m'?m.toFixed(2)+' m':(()=>{const t=Math.round(m/M_PER_IN);return t>=12?Math.floor(t/12)+"'-"+(t%12)+'"':t+'"'})();

// ---------- images ----------
const urlCache={};
function purl(ph){return urlCache[ph.id]||(urlCache[ph.id]=URL.createObjectURL(ph.blob))}
async function compress(file){
 const bmp=await createImageBitmap(file);const max=1800;const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
 const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
 c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
 return new Promise(r=>c.toBlob(r,'image/jpeg',.82));
}

// ---------- diagram (SVG) ----------
function glyph(k,xe,y,c,bg){
 switch(k){
 case 'Street light':
  return `<polyline points="${xe},${y} ${xe-12},${y-9} ${xe-32},${y-9}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`+
   `<path d="M${xe-56},${y-8} Q${xe-41},${y-24} ${xe-26},${y-8} Z" fill="${c}"/><rect x="${xe-54}" y="${y-8}" width="26" height="3" fill="${c}"/>`+
   `<g stroke="${c}" stroke-width="1.5" opacity=".75"><line x1="${xe-50}" y1="${y-2}" x2="${xe-54}" y2="${y+8}"/><line x1="${xe-41}" y1="${y-2}" x2="${xe-41}" y2="${y+9}"/><line x1="${xe-32}" y1="${y-2}" x2="${xe-28}" y2="${y+8}"/></g>`;
 case 'Power supply':
  return `<rect x="${xe-28}" y="${y-9}" width="26" height="18" rx="2" fill="${bg}" stroke="${c}" stroke-width="2"/><text x="${xe-15}" y="${y+4}" font-size="10" font-weight="700" fill="${c}" text-anchor="middle">PS</text>`;
 case 'Fuse':
  return `<line x1="${xe}" y1="${y}" x2="${xe-18}" y2="${y}" stroke="${c}" stroke-width="3" stroke-linecap="round"/><rect x="${xe-22}" y="${y}" width="8" height="21" rx="3" fill="${c}" transform="rotate(14 ${xe-18} ${y})"/><circle cx="${xe-18}" cy="${y}" r="3.2" fill="${bg}" stroke="${c}" stroke-width="1.5"/>`;
 case 'Bracket':
  return `<polyline points="${xe},${y} ${xe-22},${y} ${xe-22},${y+14}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${xe-22}" cy="${y+17}" r="3.5" fill="${c}"/>`;
 case 'Transformer':
  return `<rect x="${xe-26}" y="${y-5}" width="22" height="30" rx="5" fill="${c}" opacity=".92"/><line x1="${xe-4}" y1="${y}" x2="${xe}" y2="${y}" stroke="${c}" stroke-width="3"/>`;
 default:
  return `<line x1="${xe-14}" y1="${y}" x2="${xe+0}" y2="${y}" stroke="${c}" stroke-width="4" stroke-linecap="round"${k==='Strand - proposed'?' stroke-dasharray="6 3"':''}/>`;
 }
}
function diagram(p,o={}){
 const light=!!o.light,w=400,h=580;
 const bg=light?'#ffffff':'#0b1620',ink=light?'#222':'#cfd8df',sub=light?'#444':'#9db3c4',gnd=light?'#6b5a3e':'#7a6a4f',gtx=light?'#555':'#9a9a9a',dim=light?'#99a':'#52697c';
 const col=k=>light?shade(tcolor(k),.62):tcolor(k);
 const atts=p.attachments.filter(a=>a.height!=null).sort((a,b)=>b.height-a.height);
 const top=Math.max(p.poleHeight||0,...atts.map(a=>a.height),3)*1.04;
 const padT=24,padB=34,gy=h-padB,sc=(gy-padT)/top,px=170,pw0=16,pw1=9;
 const y=m=>gy-m*sc;const ph=p.poleHeight||Math.max(...atts.map(a=>a.height),0)+1;
 const pwAt=m=>pw0-(pw0-pw1)*Math.min(1,m/ph);
 let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">`;
 s+=`<rect width="${w}" height="${h}" fill="${bg}"/>`;
 s+=`<line x1="10" y1="${gy}" x2="${w-10}" y2="${gy}" stroke="${gnd}" stroke-width="2"/><text x="14" y="${gy+16}" font-size="11" fill="${gtx}">GROUND</text>`;
 s+=`<polygon points="${px-pw0/2},${gy} ${px+pw0/2},${gy} ${px+pw1/2},${y(ph)} ${px-pw1/2},${y(ph)}" fill="#8a6a43" stroke="#c9a46e"/>`;
 if(p.poleHeight)s+=`<text x="${px}" y="${y(ph)-6}" font-size="11" fill="${light?'#7a5a2a':'#c9a46e'}" text-anchor="middle">${esc(fmtH(p.poleHeight))}</text>`;
 const L=atts.map(a=>({a,y:y(a.height),ly:y(a.height)}));
 for(let i=1;i<L.length;i++)if(L[i].ly-L[i-1].ly<15)L[i].ly=L[i-1].ly+15;
 L.forEach(o=>{const a=o.a,c=col(a.type),pw=pwAt(a.height),xe=px-pw/2,xr=px+pw/2;
  s+=glyph(a.type,xe,o.y,c,bg);
  s+=`<polyline points="${xr},${o.y} ${xr+14},${o.y} ${px+44},${o.y} ${px+56},${o.ly}" fill="none" stroke="${c}" stroke-width="1.2"/>`;
  const own=a.owner?' ('+esc(a.owner.slice(0,10))+')':'',d=dirStr(a);
  s+=`<text x="${px+60}" y="${o.ly+4}" font-size="12" fill="${c}" font-weight="700">${esc(fmtH(a.height))} <tspan fill="${ink}" font-weight="400">${esc(tinfo(a.type).s)}${own}</tspan>${d?` <tspan fill="${c}" font-weight="700">${d}</tspan>`:''}</text>`;
 });
 for(let i=1;i<atts.length;i++){const y1=y(atts[i-1].height),y2=y(atts[i].height),g=atts[i-1].height-atts[i].height;
  if(y2-y1<12)continue;s+=`<line x1="${px-80}" y1="${y1}" x2="${px-80}" y2="${y2}" stroke="${dim}" stroke-width="1"/><text x="${px-86}" y="${(y1+y2)/2+4}" font-size="11" fill="${sub}" text-anchor="end">${esc(fmtIn(g))}</text>`}
 return s+'</svg>';
}

// ---------- navigation ----------
let view='projects',curProj=null,cur=null;
const main=$('#main'),bar=$('#bar');
function setHeader(t,back){$('#title').textContent=t;$('#back').style.display=back?'':'none'}
$('#back').onclick=()=>{if(view==='pole')showProject();else showProjects()};

function askText(title,placeholder,val=''){return new Promise(res=>{
 const m=$('#exp');$('#exph').textContent=title;
 $('#expb').innerHTML=`<input id="at" value="${esc(val)}" placeholder="${esc(placeholder)}"><button class="pri" id="aok">OK</button><button id="acx">Cancel</button>`;
 m.classList.add('on');const i=$('#at');setTimeout(()=>i.focus(),60);
 const done=v=>{m.classList.remove('on');res(v)};
 $('#aok').onclick=()=>done(i.value.trim());$('#acx').onclick=()=>done(null);i.onkeydown=e=>{if(e.key==='Enter')done(i.value.trim())}})}

// ---------- screen 1: projects ----------
let pTab='active',pSelMode=false,pSet=new Set();
async function showProjects(){
 view='projects';cur=null;curProj=null;setHeader('Pole Survey',false);
 const [projs,poles]=await Promise.all([getAll('projects'),getAll('poles')]);
 projs.forEach(p=>projName[p.id]=p.name);
 projs.sort((a,b)=>b.updated-a.updated);
 const act=projs.filter(p=>!p.archived),arc=projs.filter(p=>p.archived),ps=pTab==='active'?act:arc;
 pSet=new Set([...pSet].filter(id=>ps.some(p=>p.id===id)));
 const cnt=p=>{const mine=poles.filter(x=>x.projectId===p.id&&!x.archived);return {n:mine.length,ph:mine.reduce((t,x)=>t+x.photos.length,0)}};
 main.innerHTML=`<div class="tabs"><button class="tab ${pTab==='active'?'on':''}" data-t="active">Projects (${act.length})</button><button class="tab ${pTab==='archived'?'on':''}" data-t="archived">Archived (${arc.length})</button></div>`+
  (ps.length?`<div class="row" style="margin-bottom:12px"><button id="selb" class="sm">${pSelMode?'Cancel':'Select'}</button>${pSelMode?'<button id="alls" class="sm">Select all</button>':''}</div>`:'')+
  (ps.length?ps.map(p=>{const c=cnt(p);return `<div class="card pole-item${pSet.has(p.id)?' sel':''}" data-id="${p.id}">${pSelMode?`<div class="chk">${pSet.has(p.id)?'✓':''}</div>`:''}<div class="t"><b>${esc(p.name)}</b><br><small>${new Date(p.updated).toLocaleDateString()}</small></div><span class="badge">${c.n} poles</span><span class="badge">${c.ph} 📷</span></div>`}).join(''):
   `<div class="empty">${pTab==='active'?'No projects yet.<br>Tap “New project” — a project holds all the poles for one job, and exports as a single PDF + CSV.':'Nothing archived.'}</div>`);
 main.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{pTab=t.dataset.t;pSelMode=false;pSet.clear();showProjects()});
 main.querySelectorAll('.pole-item').forEach(e=>e.onclick=async()=>{if(pSelMode){pSet.has(e.dataset.id)?pSet.delete(e.dataset.id):pSet.add(e.dataset.id);showProjects()}else{curProj=await getOne('projects',e.dataset.id);lTab='active';lSelMode=false;lSet.clear();showProject()}});
 if($('#selb'))$('#selb').onclick=()=>{pSelMode=!pSelMode;pSet.clear();showProjects()};
 if($('#alls'))$('#alls').onclick=()=>{pSet=pSet.size===ps.length?new Set():new Set(ps.map(p=>p.id));showProjects()};
 bar.style.display='flex';
 if(pSelMode){const n=pSet.size,dis=n?'':'disabled',chosen=()=>ps.filter(p=>pSet.has(p.id));
  bar.innerHTML=`<button id="bArc" ${dis}>${pTab==='active'?'Archive':'Restore'} (${n})</button><button id="bCsv" ${dis}>CSV (${n})</button><button class="dng" id="bDel" ${dis}>Delete (${n})</button>`;
  $('#bArc').onclick=async()=>{for(const p of chosen()){p.archived=pTab==='active';await putOne('projects',p)}pSelMode=false;pSet.clear();showProjects()};
  $('#bCsv').onclick=()=>{const ids=new Set(chosen().map(p=>p.id));dl(new File([csv(poles.filter(x=>ids.has(x.projectId)&&!x.archived))],'pole_survey_projects.csv',{type:'text/csv'}))};
  $('#bDel').onclick=async()=>{const c=chosen();const np=poles.filter(x=>c.some(p=>p.id===x.projectId)).length;
   if(!confirm(`Permanently delete ${c.length} project${c.length>1?'s':''}, including ${np} pole${np===1?'':'s'} and all their photos?\n\nThis cannot be undone. Export first if you still need the data.`))return;
   for(const x of poles)if(c.some(p=>p.id===x.projectId))await delOne('poles',x.id);for(const p of c)await delOne('projects',p.id);pSelMode=false;pSet.clear();showProjects()};
 }else{
  bar.innerHTML='<button class="pri" id="newp">+ New project</button>';
  $('#newp').onclick=async()=>{const name=await askText('New project','e.g. Steinbach fibre – Phase 2');if(!name)return;
   const pr={id:uid(),name,notes:'',archived:false,created:Date.now(),updated:Date.now()};await putOne('projects',pr,true);curProj=pr;pTab='active';lTab='active';lSelMode=false;lSet.clear();showProject()};
 }
}

// ---------- screen 2: one project's poles ----------

 main.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{lTab=t.dataset.t;lSelMode=false;lSet.clear();showProject()});
 main.querySelectorAll('.pole-item').forEach(e=>e.onclick=async()=>{if(lSelMode){lSet.has(e.dataset.id)?lSet.delete(e.dataset.id):lSet.add(e.dataset.id);showProject()}else openPole(await getOne('poles',e.dataset.id))});

 bar.style.display='flex';
 if(lSelMode){const n=lSet.size,dis=n?'':'disabled',chosen=()=>ps.filter(p=>lSet.has(p.id));

// ---------- screen 3: one pole ----------
function openPole(p){cur=p;view='pole';renderPole()}
const save=async()=>{await putOne('poles',cur);if(curProj){curProj.updated=Date.now();await putOne('projects',curProj,true)}};
const markCount=ph=>cur.attachments.filter(a=>a.photoId===ph.id).length;
const fname=()=>safe(cur.poleId||'pole');
function addAtt(k,extra={}){const a={id:uid(),type:k,owner:'',height:null,dirs:[],note:'',...extra};cur.attachments.push(a);save();return a}

function renderPole(){
 setHeader(cur.poleId||'New pole',true);
 main.innerHTML=`
 <div class="card"><h2>Pole</h2>
  <div class="row"><div><label>Pole ID</label><input id="f_id" value="${esc(cur.poleId)}" placeholder="e.g. 12345 or tag #"></div>
  <div><label>Utility</label><select id="f_ut">${UTILS.map(u=>`<option ${u===cur.utility?'selected':''}>${u}</option>`).join('')}</select></div></div>

  <div class="row"><div><label>Location</label><button id="gps" style="width:100%">${cur.lat!=null?cur.lat.toFixed(5)+', '+cur.lng.toFixed(5):'📍 Get GPS'}</button></div>

 </div>
 <div class="card"><h2>Photos</h2>
  <div class="photos" id="photos">${cur.photos.map((ph,i)=>`<div class="ph" data-i="${i}"><img src="${purl(ph)}"><span class="n">${i+1}</span>${markCount(ph)?`<span class="n" style="left:auto;right:4px;background:var(--acc);color:#000">${markCount(ph)}</span>`:''}</div>`).join('')}</div>
  <div class="row" style="margin-top:10px"><label class="btn pri" style="text-align:center;margin:0">📷 Take photo<input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
  <label class="btn" style="text-align:center;margin:0">🖼 Add from gallery<input id="gal" type="file" accept="image/*" multiple hidden></label></div>
  <div style="color:var(--mut);font-size:13px;margin-top:8px">Tap a photo to zoom in and point arrows at each attachment.</div>
 </div>
 <div class="card"><h2>Attachments &amp; heights</h2>
  <div style="color:var(--mut);font-size:13px;margin-bottom:8px">Quick add here — or add them with arrows on a photo. Tap the same button again to add a second one.</div>
  <div class="chips" id="quick">${TYPES.map(t=>`<button class="chip" data-k="${t.k}" style="border-color:${t.c};color:${t.c}">+ ${t.k}</button>`).join('')}</div>
  <div id="atts" style="margin-top:14px"></div>
 </div>
 <div class="card"><h2>Diagram</h2><div id="diagram"></div></div>
 <div class="card"><h2>Notes</h2><textarea id="f_nt" rows="3" placeholder="Condition, obstructions, span lengths, traffic control…">${esc(cur.notes)}</textarea></div>
 <div class="card"><div class="bar3"><button id="arcp" style="flex:1">${cur.archived?'Restore to active':'Archive this pole'}</button><button class="dng" id="delp" style="flex:1">Delete</button></div></div>`;
 bar.style.display='flex';bar.innerHTML='<button class="pri" id="exb">Export this pole (CSV + PDF)</button>';
 const bind=(id,fn)=>$(id).addEventListener('change',fn);
 bind('#f_id',e=>{cur.poleId=e.target.value.trim();save();setHeader(cur.poleId||'New pole',true)});
 bind('#f_ut',e=>{cur.utility=e.target.value;localStorage.setItem('lastUtil',cur.utility);save()});
 bind('#f_ph',e=>{const v=parseH(e.target.value);cur.poleHeight=v;e.target.value=fmtH(v);save();drawAtts()});
 bind('#f_cl',e=>{cur.poleClass=e.target.value;save()});
 bind('#f_dt',e=>{cur.date=e.target.value;save()});
 bind('#f_nt',e=>{cur.notes=e.target.value;save()});
 $('#gps').onclick=()=>{$('#gps').textContent='Locating…';navigator.geolocation.getCurrentPosition(pos=>{cur.lat=pos.coords.latitude;cur.lng=pos.coords.longitude;save();renderPole()},()=>{$('#gps').textContent='GPS unavailable'},{enableHighAccuracy:true,timeout:15000})};
 const addPhotos=async files=>{for(const f of files){const blob=await compress(f);cur.photos.push({id:uid(),blob})}await save();renderPole()};
 $('#cam').onchange=e=>addPhotos([...e.target.files]);$('#gal').onchange=e=>addPhotos([...e.target.files]);
 document.querySelectorAll('.ph').forEach(e=>e.onclick=()=>openViewer(+e.dataset.i));
 document.querySelectorAll('#quick .chip').forEach(b=>b.onclick=()=>{const a=addAtt(b.dataset.k);drawAtts(a.id)});
 $('#arcp').onclick=async()=>{cur.archived=!cur.archived;await save();lTab=cur.archived?'archived':'active';showProject()};

function drawAtts(focusId){
 const box=$('#atts');if(!box)return;
 const list=[...cur.attachments].sort((a,b)=>(b.height??-1)-(a.height??-1));
 box.innerHTML=list.length?list.map(a=>{const n=cur.attachments.indexOf(a)+1;const over=cur.poleHeight&&a.height>cur.poleHeight;
  return `<div class="attbox" data-id="${a.id}"><div class="att"><div class="dot" style="background:${tcolor(a.type)}">${a.photoId?n:''}</div>
  <div class="nm">${esc(a.type)}<small><input class="own" value="${esc(a.owner)}" placeholder="owner / note" style="min-height:30px;padding:4px 8px;font-size:13px;font-weight:400;text-align:left;margin-top:3px"></small></div>
  <input class="ht ${over?'bad':''}" inputmode="text" value="${esc(fmtH(a.height))}" placeholder="${unit==='ft'?"23'6":'7.15'}">

 box.querySelectorAll('.attbox').forEach(r=>{const a=cur.attachments.find(x=>x.id===r.dataset.id);
  r.querySelector('.ht').onchange=e=>{a.height=parseH(e.target.value);save();drawAtts();};
  r.querySelector('.ht').onkeydown=e=>{if(e.key==='Enter')e.target.blur()};

  r.querySelectorAll('.dbtn').forEach(b=>b.onclick=()=>{a.dirs=a.dirs||[];const d=b.dataset.d,i=a.dirs.indexOf(d);i>=0?a.dirs.splice(i,1):a.dirs.push(d);save();b.classList.toggle('on');$('#diagram').innerHTML=diagram(cur)})});
 $('#diagram').innerHTML=diagram(cur);
 if(focusId){const i=box.querySelector(`[data-id="${focusId}"] .ht`);i&&i.focus()}
}

// ---------- photo viewer: pinch-zoom, pan, draggable arrows ----------
const V={vi:-1,s:1,tx:0,ty:0,w0:0,h0:0,SW:0,SH:0,ah:0,ptrs:new Map(),g:null,sel:null,pend:null};
const vstage=$('#vstage'),vwrap=$('#vwrap'),vimg=$('#vimg'),vpick=$('#vpick');
const MAXZ=10;
function arrowHTML(id,x,y,ang,color,num,sel){
 const r=ang*Math.PI/180,L=56,lx=-(L+15)*Math.cos(r),ly=-(L+15)*Math.sin(r);
 return `<div class="mk" data-id="${id}" style="left:${x*100}%;top:${y*100}%"><div class="mki"><svg width="1" height="1" style="overflow:visible;position:absolute;left:0;top:0">`+
  (sel?`<circle r="17" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="5 4"/>`:'')+
  `<g transform="rotate(${ang})"><line x1="${-L}" y1="0" x2="-6" y2="0" stroke="rgba(0,0,0,0.001)" stroke-width="38" stroke-linecap="round" style="pointer-events:stroke"/>`+
  `<line x1="${-L}" y1="0" x2="-14" y2="0" stroke="#fff" stroke-width="9" stroke-linecap="round"/><line x1="${-L}" y1="0" x2="-14" y2="0" stroke="#000" stroke-width="6.5" stroke-linecap="round"/><line x1="${-L}" y1="0" x2="-14" y2="0" stroke="${color}" stroke-width="4" stroke-linecap="round"/>`+
  `<polygon points="0,0 -22,-10 -22,10" fill="${color}" stroke="#000" stroke-width="2.4" stroke-linejoin="round"/></g>`+
  `<circle r="2" fill="#fff" stroke="#000" stroke-width=".8"/>`+
  (num?`<g transform="translate(${lx.toFixed(1)},${ly.toFixed(1)})"><circle r="10" fill="#000" fill-opacity=".75" stroke="${color}" stroke-width="1.5"/><text text-anchor="middle" dy="4" font-size="12" font-weight="700" fill="#fff" font-family="Arial">${num}</text></g>`:'')+
  `</svg></div></div>`;
}
function drawMarks(){
 const ph=cur.photos[V.vi];vwrap.querySelectorAll('.mk').forEach(e=>e.remove());
 let h='';cur.attachments.forEach((a,i)=>{if(a.photoId===ph.id&&V.sel!==a.id)h+=arrowHTML(a.id,a.x,a.y,a.ang??45,tcolor(a.type),i+1,false)});
 const sa=V.sel&&V.sel!=='new'&&cur.attachments.find(a=>a.id===V.sel);
 if(sa)h+=arrowHTML(sa.id,sa.x,sa.y,sa.ang??45,tcolor(sa.type),cur.attachments.indexOf(sa)+1,true);
 if(V.pend)h+=arrowHTML('new',V.pend.x,V.pend.y,V.pend.ang,'#ffffff',null,true);
 vwrap.insertAdjacentHTML('beforeend',h);
}
function layout(keepView){
 V.SW=vstage.clientWidth;V.SH=vstage.clientHeight;
 const nw=vimg.naturalWidth||4,nh=vimg.naturalHeight||3,sc=Math.min(V.SW/nw,V.SH/nh);
 V.w0=nw*sc;V.h0=nh*sc;vwrap.style.width=V.w0+'px';vwrap.style.height=V.h0+'px';
 if(!keepView){V.s=1;V.tx=0;V.ty=0}applyView();
}
function applyView(){
 const W=V.w0*V.s,H=V.h0*V.s,ah=V.ah||V.SH;
 V.tx=W<=V.SW?(V.SW-W)/2:Math.min(0,Math.max(V.SW-W,V.tx));
 V.ty=H<=ah?(ah-H)/2:Math.min(0,Math.max(ah-H,V.ty));
 vwrap.style.transform=`translate(${V.tx}px,${V.ty}px) scale(${V.s})`;vwrap.style.setProperty('--inv',1/V.s);
}
function zoomAt(f,cx,cy){ // cx,cy in stage coords
 const ns=Math.min(MAXZ,Math.max(1,V.s*f));if(ns===V.s)return;
 const px=(cx-V.tx)/V.s,py=(cy-V.ty)/V.s;V.s=ns;V.tx=cx-px*ns;V.ty=cy-py*ns;applyView();
}
function ensureVisible(u,v){
 const ah=V.ah||V.SH,sx=V.tx+u*V.w0*V.s,sy=V.ty+v*V.h0*V.s;
 if(sy>ah-40)V.ty-=sy-(ah-40);if(sy<95)V.ty+=95-sy;
 if(sx<70)V.tx+=70-sx;if(sx>V.SW-30)V.tx-=sx-(V.SW-30);applyView();
}
function toImg(cx,cy){const r=vstage.getBoundingClientRect();return {u:(cx-r.left-V.tx)/(V.w0*V.s),v:(cy-r.top-V.ty)/(V.h0*V.s)}}
function selAtt(){return V.sel&&V.sel!=='new'?cur.attachments.find(a=>a.id===V.sel):null}

function setPanel(){
 const a=selAtt(),chips=curK=>`<div class="vchips">${TYPES.map(t=>`<button class="chip" data-k="${t.k}" style="border-color:${t.c};${curK===t.k?`background:${t.c};color:#10202e`:`color:${t.c}`}">${t.k}</button>`).join('')}</div>`;
 let h='';
 if(V.sel==='new')h=`<div class="pt"><b>New arrow</b> — drag it so the tip is on the exact spot, then choose what it is:</div>${chips(null)}<div class="prow"><button class="sm" id="vrot">↻ Rotate arrow</button><button class="sm" id="vcancel">Cancel</button></div>`;
 else if(a)h=`<div class="pt"><b>Arrow ${cur.attachments.indexOf(a)+1}</b> — drag to move, tap a type to change it:</div>${chips(a.type)}<div class="prow"><input id="vht" inputmode="text" placeholder="Height ${unit==='ft'?"23'6":'7.15'}" value="${esc(fmtH(a.height))}"><button class="sm" id="vrot">↻ Rotate</button><button class="sm dng" id="vrm">Delete</button><button class="sm pri" id="vdone">Done</button></div>`;
 else h=`<div class="pt" style="margin:0">Tap the photo to drop an arrow. Pinch to zoom, drag to move around. Tap an arrow to edit it.</div>`;
 vpick.innerHTML=h;
 vpick.querySelectorAll('.vchips .chip').forEach(b=>b.onclick=()=>pickType(b.dataset.k));
 if($('#vrot'))$('#vrot').onclick=()=>{if(V.sel==='new')V.pend.ang=(V.pend.ang+45)%360;else{a.ang=((a.ang??45)+45)%360;save()}drawMarks()};
 if($('#vcancel'))$('#vcancel').onclick=()=>{V.pend=null;V.sel=null;drawMarks();setPanel()};
 if($('#vdone'))$('#vdone').onclick=()=>{V.sel=null;drawMarks();setPanel()};
 if($('#vrm'))$('#vrm').onclick=()=>{if((a.height!=null||(a.dirs&&a.dirs.length)||a.owner)&&!confirm('Delete this attachment and its height?'))return;cur.attachments=cur.attachments.filter(x=>x!==a);save();V.sel=null;drawMarks();setPanel()};
 if($('#vht'))$('#vht').onchange=e=>{a.height=parseH(e.target.value);e.target.value=fmtH(a.height);save()};
 V.ah=V.SH-vpick.offsetHeight;applyView();
}
function pickType(k){
 if(V.sel==='new'){const a=addAtt(k,{photoId:cur.photos[V.vi].id,x:V.pend.x,y:V.pend.y,ang:V.pend.ang});V.pend=null;V.sel=a.id}
 else{const a=selAtt();if(a){a.type=k;save()}}
 drawMarks();setPanel();
}
function selectMarker(id){V.sel=id;if(id!=='new')V.pend=null;drawMarks();setPanel();
 const a=selAtt(),m=id==='new'?V.pend:a;if(m)ensureVisible(m.x,m.y)}
function tapAt(cx,cy){
 const {u,v}=toImg(cx,cy);if(u<0||u>1||v<0||v>1)return;
 V.pend={x:u,y:v,ang:V.pend?V.pend.ang:45};V.sel='new';drawMarks();setPanel();ensureVisible(u,v);
}
function openViewer(i){
 V.vi=i;V.sel=null;V.pend=null;V.ptrs.clear();V.g=null;V.ah=0;
 $('#viewer').classList.add('on');
 const go=()=>{layout(false);drawMarks();setPanel()};
 vimg.onload=()=>requestAnimationFrame(go);vimg.src=purl(cur.photos[i]);
 if(vimg.complete&&vimg.naturalWidth)requestAnimationFrame(go);
}
vstage.addEventListener('pointerdown',e=>{
 e.preventDefault();try{vstage.setPointerCapture(e.pointerId)}catch(_){}
 V.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(V.ptrs.size===1){
  const mk=e.target.closest&&e.target.closest('.mk');
  if(mk){const id=mk.dataset.id;if(V.sel!==id)selectMarker(id);
   const m=id==='new'?V.pend:selAtt();V.g={t:'marker',id,x0:e.clientX,y0:e.clientY,ax:m.x,ay:m.y,moved:false}}
  else V.g={t:'pan',x0:e.clientX,y0:e.clientY,tx0:V.tx,ty0:V.ty,moved:false};
 }else if(V.ptrs.size===2){
  const [p,q]=[...V.ptrs.values()],r=vstage.getBoundingClientRect(),mx=(p.x+q.x)/2-r.left,my=(p.y+q.y)/2-r.top;
  V.g={t:'pinch',d0:Math.hypot(p.x-q.x,p.y-q.y)||1,s0:V.s,ix:(mx-V.tx)/V.s,iy:(my-V.ty)/V.s};
 }
});
vstage.addEventListener('pointermove',e=>{
 if(!V.ptrs.has(e.pointerId))return;V.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});const g=V.g;if(!g)return;
 if(g.t==='pan'){const dx=e.clientX-g.x0,dy=e.clientY-g.y0;if(!g.moved&&Math.hypot(dx,dy)>8)g.moved=true;if(g.moved){V.tx=g.tx0+dx;V.ty=g.ty0+dy;applyView()}}
 else if(g.t==='marker'){const dx=e.clientX-g.x0,dy=e.clientY-g.y0;if(!g.moved&&Math.hypot(dx,dy)>5)g.moved=true;
  if(g.moved){const x=Math.min(1,Math.max(0,g.ax+dx/(V.w0*V.s))),y=Math.min(1,Math.max(0,g.ay+dy/(V.h0*V.s)));
   const m=g.id==='new'?V.pend:selAtt();m.x=x;m.y=y;const el=vwrap.querySelector(`.mk[data-id="${g.id}"]`);if(el){el.style.left=x*100+'%';el.style.top=y*100+'%'}}}
 else if(g.t==='pinch'&&V.ptrs.size>=2){
  const [p,q]=[...V.ptrs.values()],r=vstage.getBoundingClientRect(),mx=(p.x+q.x)/2-r.left,my=(p.y+q.y)/2-r.top,d=Math.hypot(p.x-q.x,p.y-q.y);
  V.s=Math.min(MAXZ,Math.max(1,g.s0*d/g.d0));V.tx=mx-g.ix*V.s;V.ty=my-g.iy*V.s;applyView();
 }
});
function pEnd(e){
 if(!V.ptrs.has(e.pointerId))return;const g=V.g;V.ptrs.delete(e.pointerId);
 if(g&&g.t==='pan'&&!g.moved&&e.type==='pointerup')tapAt(e.clientX,e.clientY);
 else if(g&&g.t==='marker'&&g.moved){if(g.id!=='new')save();drawMarks()}
 V.g=V.ptrs.size?{t:'none'}:null;
}
vstage.addEventListener('pointerup',pEnd);vstage.addEventListener('pointercancel',pEnd);
vstage.addEventListener('wheel',e=>{e.preventDefault();const r=vstage.getBoundingClientRect();zoomAt(e.deltaY<0?1.2:1/1.2,e.clientX-r.left,e.clientY-r.top)},{passive:false});
$('#vzi').onclick=()=>zoomAt(1.6,V.SW/2,(V.ah||V.SH)/2);$('#vzo').onclick=()=>zoomAt(1/1.6,V.SW/2,(V.ah||V.SH)/2);

// ---------- CSV ----------
function csv(poles){
 const rows=[['Project','Pole ID','Utility','Lat','Lng','Date','Pole height (m)','Pole height','Class','Attachment','Direction(s)','Owner/Note','Height (m)','Height (ft-in)','Photo #','Pole notes']];
 const ftin=m=>{const t=Math.round(m/M_PER_IN);return Math.floor(t/12)+"'-"+(t%12)+'"'};
 poles.forEach(p=>{const base=[projName[p.projectId]||'',p.poleId,p.utility,p.lat??'',p.lng??'',p.date,p.poleHeight!=null?p.poleHeight.toFixed(3):'',p.poleHeight!=null?ftin(p.poleHeight):'',p.poleClass];
  const at=[...p.attachments].sort((a,b)=>(b.height??-1)-(a.height??-1));
  if(!at.length)rows.push([...base,'','','','','','',p.notes]);
  at.forEach(a=>{const ph=p.photos.findIndex(x=>x.id===a.photoId);rows.push([...base,a.type,dirStr(a),a.owner,a.height!=null?a.height.toFixed(3):'',a.height!=null?ftin(a.height):'',ph>=0?ph+1:'',p.notes])})});
 return '﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
}
function dl(file){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove()}

// ---------- PDF (pages drawn on canvas, photos embedded as original JPEG) ----------
const PW=1275,PH=1650,PM=60;
function mkPage(){const c=document.createElement('canvas');c.width=PW;c.height=PH;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,PW,PH);g.fillStyle='#111';g.textBaseline='top';return {c,g}}
const svgImg=svg=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('diagram render failed'));i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
function fit(g,text,maxW,px,weight=''){let s=px;do{g.font=`${weight} ${s}px Arial`;if(g.measureText(text).width<=maxW)break;s-=1}while(s>14);return s}
function wrap(g,text,x,y,maxW,lh){for(const para of String(text).split('\n')){let line='';for(const w of para.split(/\s+/)){const t=line?line+' '+w:w;if(g.measureText(t).width>maxW&&line){g.fillText(line,x,y);y+=lh;line=w}else line=t}g.fillText(line,x,y);y+=lh}return y}
function fitDraw(g,bmp,x,y,w,h){const s=Math.min(w/bmp.width,h/bmp.height),dw=bmp.width*s,dh=bmp.height*s,dx=x+(w-dw)/2,dy=y;g.drawImage(bmp,dx,dy,dw,dh);return {dx,dy,dw,dh}}
const sortedAtts=p=>[...p.attachments].sort((a,b)=>(b.height??-1)-(a.height??-1));
function drawArrowC(g,cx,cy,ang,color){
 const r=ang*Math.PI/180,L=78,hl=28,hw=13;g.save();g.translate(cx,cy);g.rotate(r);g.lineCap='round';g.lineJoin='round';
 g.beginPath();g.moveTo(-L,0);g.lineTo(-hl+4,0);
 g.strokeStyle='#fff';g.lineWidth=14;g.stroke();g.strokeStyle='#000';g.lineWidth=10;g.stroke();g.strokeStyle=color;g.lineWidth=6;g.stroke();
 g.fillStyle=color;g.strokeStyle='#000';g.lineWidth=3;g.beginPath();g.moveTo(0,0);g.lineTo(-hl,-hw);g.lineTo(-hl,hw);g.closePath();g.fill();g.stroke();
 g.restore();g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=2;g.beginPath();g.arc(cx,cy,3.5,0,7);g.fill();g.stroke();
 return {tx:cx-L*Math.cos(r),ty:cy-L*Math.sin(r),c:Math.cos(r),s:Math.sin(r)};
}
async function readBytes(blob){
 try{return new Uint8Array(await blob.arrayBuffer())}catch(e){}
 return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(new Uint8Array(fr.result));fr.onerror=()=>rej(new Error('photo could not be read'));fr.readAsArrayBuffer(blob)});
}
async function decodeJpeg(bytes){ // decode from a fresh in-memory copy (Safari can't decode blobs straight out of IndexedDB)
 const blob=new Blob([bytes],{type:'image/jpeg'});
 try{return await createImageBitmap(blob)}catch(e){}
 const img=new Image();img.src=URL.createObjectURL(blob);
 try{await img.decode()}catch(e){throw new Error('photo could not be decoded')}
 return img;
}
function jpegSize(b){let i=2;while(i+9<b.length){if(b[i]!==0xFF){i++;continue}const m=b[i+1];if(m===0xFF){i++;continue}
 if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC)return {h:(b[i+5]<<8)|b[i+6],w:(b[i+7]<<8)|b[i+8]};
 i+=2+((b[i+2]<<8)|b[i+3])}return null}
async function pgSummary(p){
 const {c,g}=mkPage();
 g.fillStyle='#111';g.font='bold 56px Arial';g.fillText('Pole '+(p.poleId||'—'),PM,PM);
 if(projName[p.projectId]){g.font='28px Arial';g.fillStyle='#777';g.textAlign='right';g.fillText(projName[p.projectId],PW-PM,PM+14);g.textAlign='left'}
 g.font='32px Arial';g.fillStyle='#444';
 g.fillText(`${p.utility}   |   ${p.date}`,PM,PM+76);
 g.fillText(`Pole height: ${fmtH(p.poleHeight)||'—'}      Class: ${p.poleClass||'—'}`,PM,PM+122);
 g.fillText('GPS: '+(p.lat!=null?p.lat.toFixed(6)+', '+p.lng.toFixed(6):'—'),PM,PM+168);
 g.drawImage(await svgImg(diagram(p,{light:true})),PM,270,560,812);
 g.strokeStyle='#bbb';g.lineWidth=2;g.strokeRect(PM,270,560,812);
 const x0=660,W=555,cw=[48,215,112,180];let y=270;
 g.fillStyle='#e8e8e8';g.fillRect(x0,y,W,46);g.fillStyle='#111';g.font='bold 26px Arial';
 let cx=x0+8;['#','Attachment','Dir','Height'].forEach((t,i)=>{g.fillText(t,cx,y+9);cx+=cw[i]});y+=46;
 for(const a of sortedAtts(p)){
  const rh=a.owner?66:48;
  if(y+rh>1590){g.fillStyle='#666';g.font='italic 24px Arial';g.fillText('… more rows in the CSV',x0+8,y+8);break}
  const n=a.photoId?String(p.attachments.indexOf(a)+1):'';
  cx=x0+8;g.fillStyle='#111';
  g.font='26px Arial';g.fillText(n,cx,y+10);cx+=cw[0];
  g.fillStyle=shade(tcolor(a.type),.55);g.font='26px Arial';g.fillText('■ ',cx-2,y+10);
  g.fillStyle='#111';fit(g,a.type,cw[1]-34,26);g.fillText(a.type,cx+24,y+10);
  if(a.owner){g.fillStyle='#666';g.font='22px Arial';fit(g,a.owner,cw[1]-34,22);g.fillText(a.owner,cx+24,y+40)}
  cx+=cw[1];g.fillStyle='#111';fit(g,dirStr(a),cw[2]-10,26,'bold');g.fillText(dirStr(a),cx,y+10);
  cx+=cw[2];fit(g,fmtH(a.height),cw[3]-8,28,'bold');g.fillText(fmtH(a.height),cx,y+9);
  y+=rh;g.strokeStyle='#ccc';g.lineWidth=1;g.beginPath();g.moveTo(x0,y);g.lineTo(x0+W,y);g.stroke();
 }
 if(p.notes){g.fillStyle='#111';g.font='bold 28px Arial';g.fillText('Notes',PM,1120);g.font='26px Arial';g.fillStyle='#333';wrap(g,p.notes,PM,1160,560,34)}
 g.fillStyle='#888';g.font='20px Arial';g.fillText(`Pole ${p.poleId||''} · summary`,PM,PH-44);
 return c;
}
async function pgAnnot(p,i){
 const {c,g}=mkPage(),ph=p.photos[i];
 g.fillStyle='#111';g.font='bold 40px Arial';g.fillText(`Pole ${p.poleId||'—'} — Photo ${i+1}: attachments & heights`,PM,PM-10);
 const bmp=await decodeJpeg(await readBytes(ph.blob));
 const r=fitDraw(g,bmp,PM,110,PW-2*PM,1000);
 const on=p.attachments.map((a,idx)=>({a,n:idx+1})).filter(o=>o.a.photoId===ph.id);
 for(const o of on){const a=o.a,cx=r.dx+a.x*r.dw,cy=r.dy+a.y*r.dh;
  const t=drawArrowC(g,cx,cy,a.ang??45,tcolor(a.type));
  const txt=`${o.n}: ${tinfo(a.type).s}${a.height!=null?'  '+fmtH(a.height):''}${dirStr(a)?'  '+dirStr(a):''}`;g.font='bold 30px Arial';const tw=g.measureText(txt).width+22,th=42;
  let bx,by;
  if(Math.abs(t.c)<0.25){bx=t.tx-tw/2;by=t.s>0?t.ty-th-6:t.ty+6}else{bx=t.c>0?t.tx-tw-4:t.tx+4;by=t.ty-th/2}
  bx=Math.min(r.dx+r.dw-tw,Math.max(r.dx,bx));by=Math.min(r.dy+r.dh-th,Math.max(r.dy,by));
  g.fillStyle='rgba(0,0,0,.8)';g.fillRect(bx,by,tw,th);g.fillStyle=tcolor(a.type);g.fillRect(bx,by,7,th);
  g.fillStyle='#fff';g.textBaseline='middle';g.fillText(txt,bx+16,by+th/2+1);g.textBaseline='top'}
 let ly=r.dy+r.dh+30;
 g.font='bold 28px Arial';g.fillStyle='#111';g.fillText('Attachments on this photo',PM,ly);ly+=44;
 const per=Math.max(1,Math.floor((PH-50-ly)/42));
 on.forEach((o,k)=>{const col=Math.floor(k/per),row=k%per,x=PM+col*590,y=ly+row*42;
  g.fillStyle=tcolor(o.a.type);g.beginPath();g.arc(x+18,y+16,16,0,7);g.fill();
  g.fillStyle='#000';g.font='bold 20px Arial';g.textAlign='center';g.fillText(String(o.n),x+18,y+6);g.textAlign='left';
  const lab=`${o.a.type}${o.a.owner?' ('+o.a.owner+')':''}   ${dirStr(o.a)}`;
  g.fillStyle='#111';fit(g,lab,380,26);g.fillText(lab,x+44,y+4);
  g.font='bold 28px Arial';g.fillText(fmtH(o.a.height)||'—',x+440,y+3)});
 bmp.close&&bmp.close();return c;
}
async function pgCovers(proj,poles){
 const out=[],per1=24,per2=31;let idx=0;
 const photos=poles.reduce((t,p)=>t+p.photos.length,0);
 do{const {c,g}=mkPage(),first=out.length===0;let y=PM;
  if(first){g.fillStyle='#777';g.font='30px Arial';g.fillText('PROJECT',PM,y);y+=44;g.fillStyle='#111';fit(g,proj.name,PW-2*PM,64,'bold');g.fillText(proj.name,PM,y);y+=90;
   g.fillStyle='#444';g.font='30px Arial';g.fillText(`${poles.length} pole${poles.length===1?'':'s'}  ·  ${photos} photo${photos===1?'':'s'}  ·  exported ${new Date().toLocaleDateString()}`,PM,y);y+=50;
   if(proj.notes){g.font='26px Arial';y=wrap(g,proj.notes,PM,y,PW-2*PM,34)+10}y+=20}
  const x0=PM,W=PW-2*PM,cw=[70,420,330,200,155];
  g.fillStyle='#e8e8e8';g.fillRect(x0,y,W,46);g.fillStyle='#111';g.font='bold 26px Arial';let cx=x0+10;['#','Pole ID','Utility','Attachments','Photos'].forEach((t,i)=>{g.fillText(t,cx,y+9);cx+=cw[i]});y+=46;
  const per=first?per1:per2;
  for(let k=0;k<per&&idx<poles.length;k++,idx++){const p=poles[idx];cx=x0+10;g.fillStyle='#111';g.font='26px Arial';
   g.fillText(String(idx+1),cx,y+10);cx+=cw[0];fit(g,p.poleId||'(no ID)',cw[1]-14,26,'bold');g.fillText(p.poleId||'(no ID)',cx,y+10);cx+=cw[1];
   fit(g,p.utility,cw[2]-14,26);g.fillText(p.utility,cx,y+10);cx+=cw[2];g.font='26px Arial';g.fillText(String(p.attachments.length),cx,y+10);cx+=cw[3];g.fillText(String(p.photos.length),cx,y+10);
   y+=48;g.strokeStyle='#ccc';g.lineWidth=1;g.beginPath();g.moveTo(x0,y);g.lineTo(x0+W,y);g.stroke()}
  out.push(c)}while(idx<poles.length);
 return out;
}
async function pgFromCanvas(c){
 const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));const bytes=new Uint8Array(await bl.arrayBuffer());const iw=c.width,ih=c.height;c.width=c.height=0;
 return {W:612,H:792,bytes,iw,ih,content:'q 612 0 0 792 0 0 cm /Im0 Do Q'};
}
const pdfStr=t=>String(t).replace(/[^\x20-\x7E]/g,'?').replace(/([\\()])/g,'\\$1');
async function pgFromPhoto(p,i){
 const bytes=await readBytes(p.photos[i].blob);let sz=jpegSize(bytes);
 if(!sz){const bmp=await decodeJpeg(bytes);sz={w:bmp.width,h:bmp.height};bmp.close&&bmp.close()}
 const iw=sz.w,ih=sz.h,land=iw>ih,W=land?792:612,H=land?612:792,m=28,capH=26,aw=W-2*m,ah=H-2*m-capH;
 const s=Math.min(aw/iw,ah/ih),dw=iw*s,dh=ih*s,x=(W-dw)/2,y=m+(ah-dh)/2;
 const cap=`Pole ${p.poleId||'-'} - Photo ${i+1} of ${p.photos.length}`;
 return {W,H,bytes,iw,ih,content:`BT /F1 13 Tf ${m} ${H-m-12} Td (${pdfStr(cap)}) Tj ET q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`};
}
function buildPdf(pg){
 const enc=new TextEncoder(),chunks=[],offs=[];let pos=0;
 const w=b=>{if(typeof b==='string')b=enc.encode(b);chunks.push(b);pos+=b.length};
 const n=pg.length;
 const obj=(id,fn)=>{offs[id]=pos;w(`${id} 0 obj\n`);fn();w('endobj\n')};
 w('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
 obj(1,()=>w('<< /Type /Catalog /Pages 2 0 R >>\n'));
 obj(2,()=>w(`<< /Type /Pages /Count ${n} /Kids [${pg.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] >>\n`));
 pg.forEach((q,i)=>{const pid=3+3*i,cid=pid+1,iid=pid+2;
  obj(pid,()=>w(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${q.W} ${q.H}] /Resources << /XObject << /Im0 ${iid} 0 R >> /Font << /F1 << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> >> >> /Contents ${cid} 0 R >>\n`));
  obj(cid,()=>w(`<< /Length ${q.content.length} >>\nstream\n${q.content}\nendstream\n`));
  obj(iid,()=>{w(`<< /Type /XObject /Subtype /Image /Width ${q.iw} /Height ${q.ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${q.bytes.length} >>\nstream\n`);w(q.bytes);w('\nendstream\n')})});
 const xref=pos,total=3+3*n;
 w(`xref\n0 ${total}\n0000000000 65535 f \n`);
 for(let id=1;id<total;id++)w(String(offs[id]).padStart(10,'0')+' 00000 n \n');
 w(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
 return new Blob(chunks,{type:'application/pdf'});
}
async function makePdf(poles,opts={}){
 const pgs=[];
 if(opts.project)for(const c of await pgCovers(opts.project,poles))pgs.push(await pgFromCanvas(c));
 for(let k=0;k<poles.length;k++){const p=poles[k];
  if(opts.onProgress){opts.onProgress(k+1,poles.length,p);await tick()}
  pgs.push(await pgFromCanvas(await pgSummary(p)));
  for(let i=0;i<p.photos.length;i++)if(p.attachments.some(a=>a.photoId===p.photos[i].id)){
   try{pgs.push(await pgFromCanvas(await pgAnnot(p,i)))}catch(e){(opts.skipped||[]).push(`${p.poleId||'(no ID)'} photo ${i+1} (tagged page)`)}}
  for(let i=0;i<p.photos.length;i++){
   try{pgs.push(await pgFromPhoto(p,i))}catch(e){(opts.skipped||[]).push(`${p.poleId||'(no ID)'} photo ${i+1}`)}}
 }
 return buildPdf(pgs);
}

// ---------- export dialog ----------
async function exportDialog({base,poles,project}){
 poles=(await Promise.all(poles.map(async p=>(await getOne('poles',p.id))||p)));
 const skipped=[];
 const m=$('#exp'),h=$('#exph'),b=$('#expb');m.classList.add('on');
 h.textContent=project?'Building project PDF…':'Building PDF…';b.innerHTML='<div class="empty" id="prog" style="padding:10px">Starting…</div>';
 await tick();
 let pdf;try{pdf=await makePdf(poles,{project,skipped,onProgress:(k,n,p)=>{const e=$('#prog');if(e)e.textContent=`Pole ${k} of ${n}: ${p.poleId||'(no ID)'}`}})}
 catch(e){h.textContent='Could not build the PDF';b.innerHTML=`<p style="color:var(--mut)">${esc(e.message)}</p><button id="xc">Close</button>`;$('#xc').onclick=()=>m.classList.remove('on');return}
 const files=[new File([pdf],base+'.pdf',{type:'application/pdf'}),new File([csv(poles)],base+'.csv',{type:'text/csv'})];
 const photos=[],seen={};
 poles.forEach(p=>{let nm=safe(p.poleId||'pole');seen[nm]=(seen[nm]||0)+1;if(seen[nm]>1)nm+='_'+seen[nm];p.photos.forEach((ph,i)=>photos.push(new File([ph.blob],`${nm}_photo${i+1}.jpg`,{type:'image/jpeg'})))});
 const kb=f=>f.size>1048576?(f.size/1048576).toFixed(1)+' MB':Math.round(f.size/1024)+' KB';
 const canShare=f=>navigator.canShare&&navigator.canShare({files:f});
 h.textContent='Ready to send';
 b.innerHTML=`<div style="color:var(--mut);font-size:13px;margin-bottom:10px">${poles.length} pole${poles.length===1?'':'s'}, ${photos.length} photo${photos.length===1?'':'s'} — the PDF has the sketches, tagged photos and every photo at full size.</div>
  ${skipped.length?`<div style="color:var(--bad);font-size:13px;margin-bottom:10px">⚠ Could not read: ${esc(skipped.join(', '))}. Those photos are not in the PDF — retake them if needed.</div>`:''}
  <div>📄 ${esc(files[0].name)} <small>${kb(files[0])}</small></div><div style="margin-top:8px">📊 ${esc(files[1].name)} <small>${kb(files[1])}</small></div>
  ${canShare(files)?'<button class="pri" id="xs">Share PDF + CSV</button>':''}
  <button id="xd" ${canShare(files)?'':'class="pri"'}>Download PDF + CSV</button>
  ${photos.length?(canShare(photos)?`<button id="xp">Share ${photos.length} photo${photos.length>1?'s':''} separately</button>`:`<button id="xp">Download ${photos.length} photo${photos.length>1?'s':''} separately</button>`):''}
  <button id="xc">Close</button>`;
 const sh=async f=>{try{await navigator.share({files:f,title:base})}catch(e){}};
 if($('#xs'))$('#xs').onclick=()=>sh(files);
 if($('#xp'))$('#xp').onclick=()=>canShare(photos)?sh(photos):photos.forEach((f,i)=>setTimeout(()=>dl(f),i*500));
 $('#xd').onclick=()=>{files.forEach((f,i)=>setTimeout(()=>dl(f),i*500))};
 $('#xc').onclick=()=>m.classList.remove('on');
}
